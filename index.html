<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یادآور ابری با تلگرام (شمسی)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- فونت وزیرمتن -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <!-- کتابخانه تبدیل تاریخ شمسی -->
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- بخش ورود -->
  <div id="login-screen" class="w-full max-w-sm bg-slate-800 p-8 rounded-2xl shadow-xl text-center border border-slate-700">
    <h2 class="text-xl font-bold text-emerald-400 mb-2">ورود به سیستم</h2>
    <p class="text-xs text-slate-400 mb-6">شناسه عددی (Chat ID) تلگرام خود را وارد کنید</p>
    <input id="chat-id-input" type="number" placeholder="مثال: 123456789" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 mb-4 focus:outline-none focus:border-emerald-500 text-slate-100" />
    <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition-colors">ورود امن</button>
  </div>

  <!-- بخش اپلیکیشن (مخفی در ابتدا) -->
  <div id="app-screen" class="w-full max-w-2xl hidden pb-10 mt-10">
    <header class="flex justify-between items-center mb-8 pt-4 pb-4 border-b border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">یادآور ابری (نسخه شمسی)</h1>
        <p class="text-xs text-slate-400 mt-1">متصل به تلگرام و دیتابیس</p>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-800 px-3 py-1 rounded text-rose-400 hover:bg-slate-700 border border-slate-700 transition-colors">خروج از سیستم</button>
    </header>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-lg">
      <form onsubmit="addReminder(event)" class="space-y-5">
        <div>
          <label class="block text-sm text-slate-300 mb-1">عنوان یادآور</label>
          <input id="title" type="text" required placeholder="مثال: جلسه آنلاین با تیم" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100" />
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <!-- تاریخ شمسی -->
          <div class="md:col-span-6">
            <label class="block text-sm text-slate-300 mb-1">تاریخ (شمسی)</label>
            <div class="flex gap-1">
              <select id="j-day" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></select>
              <select id="j-month" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></select>
              <select id="j-year" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></select>
            </div>
          </div>
          
          <!-- ساعت -->
          <div class="md:col-span-3">
            <label class="block text-sm text-slate-300 mb-1">ساعت</label>
            <div class="flex gap-1 items-center">
              <select id="j-hour" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></select>
              <span class="text-slate-400 font-bold">:</span>
              <select id="j-minute" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></select>
            </div>
          </div>

          <!-- اولویت -->
          <div class="md:col-span-3">
            <label class="block text-sm text-slate-300 mb-1">اولویت</label>
            <select id="priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
              <option value="low">عادی (سبز)</option>
              <option value="medium" selected>متوسط (زرد)</option>
              <option value="high">فوری (قرمز)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm text-slate-300 mb-1">توضیحات (اختیاری)</label>
          <textarea id="desc" rows="2" placeholder="جزییات بیشتر..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></textarea>
        </div>

        <button id="submit-btn" type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition-colors shadow-lg shadow-emerald-900/30">
          ثبت یادآور در سیستم ابری
        </button>
      </form>
    </div>

    <div id="loading" class="text-center text-emerald-500 text-sm hidden mb-4 animate-pulse">در حال ارتباط با سرور دیتابیس...</div>
    <div id="reminders-list" class="space-y-3"></div>
  </div>

  <script>
    const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
    let currentChatId = localStorage.getItem('user_chat_id');

    // مقداردهی اولیه تقویم شمسی با زمان حال
    function initDatePicker() {
      const now = new Date();
      const jNow = jalaali.toJalaali(now);

      document.getElementById('j-day').innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i+1}" ${i+1 === jNow.jd ? 'selected' : ''}>${i+1}</option>`).join('');
      document.getElementById('j-month').innerHTML = monthNames.map((m, i) => `<option value="${i+1}" ${i+1 === jNow.jm ? 'selected' : ''}>${m}</option>`).join('');
      document.getElementById('j-year').innerHTML = Array.from({length: 5}, (_, i) => `<option value="${jNow.jy + i}">${jNow.jy + i}</option>`).join('');
      document.getElementById('j-hour').innerHTML = Array.from({length: 24}, (_, i) => `<option value="${i}" ${i === now.getHours() ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
      document.getElementById('j-minute').innerHTML = Array.from({length: 60}, (_, i) => `<option value="${i}" ${i === now.getMinutes() ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
    }

    if (currentChatId) {
      initDatePicker();
      showApp();
    }

    function login() {
      const input = document.getElementById('chat-id-input').value.trim();
      if (!input) return alert('لطفاً Chat ID را وارد کنید');
      currentChatId = input;
      localStorage.setItem('user_chat_id', currentChatId);
      initDatePicker();
      showApp();
    }

    function logout() {
      localStorage.removeItem('user_chat_id');
      window.location.reload();
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      fetchReminders();
    }

    async function apiCall(method, body = null) {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const res = await fetch(`/api/reminders?chat_id=${currentChatId}`, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : null
        });
        document.getElementById('loading').classList.add('hidden');
        return await res.json();
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        alert('خطا در ارتباط با سرور');
        return null;
      }
    }

    async function fetchReminders() {
      const reminders = await apiCall('GET');
      if(reminders) render(reminders);
    }

    async function addReminder(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'در حال ثبت...';
      
      // تبدیل تاریخ شمسی انتخاب شده به تاریخ استاندارد میلادی برای بک‌اند
      const jy = parseInt(document.getElementById('j-year').value);
      const jm = parseInt(document.getElementById('j-month').value);
      const jd = parseInt(document.getElementById('j-day').value);
      const h = parseInt(document.getElementById('j-hour').value);
      const m = parseInt(document.getElementById('j-minute').value);

      const gregorian = jalaali.toGregorian(jy, jm, jd);
      const targetDate = new Date(gregorian.gy, gregorian.gm - 1, gregorian.gd, h, m);

      const payload = {
        title: document.getElementById('title').value,
        datetime: targetDate.toISOString(), // ارسال زمان استاندارد به سرور
        priority: document.getElementById('priority').value,
        desc: document.getElementById('desc').value,
      };

      const res = await apiCall('POST', payload);
      if (res && res.success) {
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
        render(res.reminders);
      }
      btn.textContent = 'ثبت یادآور در سیستم ابری';
    }

    async function toggleComplete(id) {
      const res = await apiCall('POST', { action: 'complete', id });
      if(res && res.success) render(res.reminders);
    }

    async function deleteReminder(id) {
      if(confirm('آیا از حذف این یادآور اطمینان دارید؟')) {
        const res = await apiCall('POST', { action: 'delete', id });
        if(res && res.success) render(res.reminders);
      }
    }

    // فرمت کردن تاریخ میلادی دریافتی از سرور به شمسی برای نمایش
    function formatToJalaliString(isoDate) {
      const d = new Date(isoDate);
      const j = jalaali.toJalaali(d);
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      return `${j.jy}/${String(j.jm).padStart(2, '0')}/${String(j.jd).padStart(2, '0')} - ${h}:${m}`;
    }

    function render(reminders) {
      const container = document.getElementById('reminders-list');
      container.innerHTML = '';
      if (!reminders || reminders.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-500 border border-dashed border-slate-700 rounded-xl">هیچ یادآوری ثبت نشده است.</div>';
        return;
      }
      
      const priorityStyle = {
        high: 'border-rose-500/60 bg-rose-950/20 text-rose-400',
        medium: 'border-amber-500/60 bg-amber-950/20 text-amber-400',
        low: 'border-emerald-500/60 bg-emerald-950/20 text-emerald-400'
      };

      const priorityLabel = { high: 'فوری', medium: 'متوسط', low: 'عادی' };

      reminders.sort((a, b) => new Date(a.datetime) - new Date(b.datetime)).forEach(r => {
        const jDate = formatToJalaliString(r.datetime);
        container.innerHTML += `
          <div class="border rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition-all ${r.completed ? 'bg-slate-900/50 border-slate-800 opacity-60' : 'bg-slate-800/80 border-slate-700 hover:border-slate-600'}">
            <div class="w-full">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[10px] px-2 py-0.5 rounded border font-medium ${priorityStyle[r.priority]}">${priorityLabel[r.priority]}</span>
                <h3 class="font-medium text-slate-100 ${r.completed ? 'line-through text-slate-400' : ''}">${r.title}</h3>
                ${r.sent ? '<span class="text-[10px] bg-blue-900/30 text-blue-400 border border-blue-800/50 px-2 py-0.5 rounded-full mr-2 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>ارسال شد</span>' : ''}
              </div>
              ${r.desc ? `<p class="text-xs text-slate-400 mt-1">${r.desc}</p>` : ''}
              <div class="text-xs text-slate-400 mt-3 flex items-center gap-1">
                <span>⏰ سررسید:</span>
                <span dir="ltr" class="font-mono bg-slate-900 px-2 py-0.5 rounded border border-slate-700">${jDate}</span>
              </div>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
              <button onclick="toggleComplete(${r.id})" class="px-3 py-1.5 text-xs rounded-lg border border-slate-600 hover:bg-slate-700 text-slate-300 w-full sm:w-auto transition-colors">
                ${r.completed ? 'بازگردانی' : 'انجام شد'}
              </button>
              <button onclick="deleteReminder(${r.id})" class="px-3 py-1.5 text-xs rounded-lg border border-rose-900/60 hover:bg-rose-900/40 text-rose-400 w-full sm:w-auto transition-colors">
                حذف
              </button>
            </div>
          </div>`;
      });
    }
  </script>
</body>
</html>
