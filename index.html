<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یادآور هوشمند ابری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    /* استایل اختصاصی برای اسکرول‌بار نرم‌تر */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-[#0f172a] to-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col items-center selection:bg-emerald-500/30">

  <!-- صفحه لاگین -->
  <div id="login-screen" class="w-full max-w-sm mt-20 bg-white/5 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/10 text-center relative overflow-hidden hidden">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-teal-500"></div>
    <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">ورود به سیستم</h2>
    <p class="text-sm text-slate-400 mb-8">شناسه عددی تلگرام خود را وارد کنید</p>
    <input id="chat-id-input" type="number" placeholder="مثال: 123456789" class="w-full text-center bg-black/20 border border-white/10 rounded-xl px-4 py-3.5 mb-6 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 text-white placeholder-slate-500 transition-all" />
    <button onclick="login()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-500/25 transition-all transform hover:-translate-y-0.5">ورود امن</button>
  </div>

  <!-- صفحه اصلی اپلیکیشن -->
  <div id="app-screen" class="w-full max-w-5xl hidden pb-12">
    <!-- هدر -->
    <header class="flex justify-between items-center mb-10 pt-6">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">یادآور هوشمند</h1>
          <p class="text-sm text-emerald-400 mt-0.5 font-medium">متصل به فضای ابری و تلگرام</p>
        </div>
      </div>
      <button onclick="logout()" class="text-sm bg-white/5 hover:bg-white/10 px-4 py-2.5 rounded-xl text-rose-400 border border-rose-500/20 hover:border-rose-500/40 transition-all flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="hidden sm:inline">خروج</span>
      </button>
    </header>

    <!-- فرم ثبت/ویرایش یادآور -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 mb-10 shadow-2xl relative">
      <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden absolute top-6 left-6 text-xs bg-slate-700/50 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition-colors border border-white/5">انصراف ✖</button>
      
      <form onsubmit="saveReminder(event)" class="space-y-6">
        <div>
          <label class="flex items-center gap-2 text-sm font-medium text-slate-300 mb-2">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            عنوان وظیفه
          </label>
          <input id="title" type="text" required placeholder="مثلاً: تمدید قرارداد سرور" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 text-white placeholder-slate-600 transition-all" />
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- تاریخ -->
          <div class="bg-black/10 p-4 rounded-2xl border border-white/5">
            <label class="flex items-center gap-2 text-sm font-medium text-slate-300 mb-3">
              <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              تاریخ سررسید
            </label>
            <div class="flex gap-2">
              <select id="j-day" class="w-1/3 bg-black/20 border border-white/10 rounded-lg px-2 py-2.5 text-center text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200"></select>
              <select id="j-month" class="w-1/3 bg-black/20 border border-white/10 rounded-lg px-2 py-2.5 text-center text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200"></select>
              <select id="j-year" class="w-1/3 bg-black/20 border border-white/10 rounded-lg px-2 py-2.5 text-center text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200"></select>
            </div>
          </div>
          
          <!-- ساعت و اولویت -->
          <div class="bg-black/10 p-4 rounded-2xl border border-white/5 grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">ساعت</label>
              <div class="flex gap-1 items-center">
                <select id="j-hour" class="w-1/2 bg-black/20 border border-white/10 rounded-lg px-1 py-2.5 text-center text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200"></select>
                <span class="text-slate-500 font-bold">:</span>
                <select id="j-minute" class="w-1/2 bg-black/20 border border-white/10 rounded-lg px-1 py-2.5 text-center text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200"></select>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">اولویت</label>
              <select id="priority" class="w-full bg-black/20 border border-white/10 rounded-lg px-2 py-2.5 text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200">
                <option value="low">عادی (🟢)</option>
                <option value="medium" selected>متوسط (🟡)</option>
                <option value="high">فوری (🔴)</option>
              </select>
            </div>
          </div>
          
          <!-- تنظیمات پیشرفته -->
          <div class="bg-black/10 p-4 rounded-2xl border border-white/5 grid grid-cols-2 gap-4 md:col-span-2 lg:col-span-1">
            <div>
              <label class="block text-xs sm:text-sm font-medium text-slate-300 mb-3 whitespace-nowrap">هشدار تلگرام</label>
              <select id="advance" class="w-full bg-black/20 border border-white/10 rounded-lg px-2 py-2.5 text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200">
                <option value="0" selected>سر وقت</option>
                <option value="1">۱ روز قبل</option>
                <option value="3">۳ روز قبل</option>
                <option value="5">۵ روز قبل</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">تکرار</label>
              <select id="recurring" class="w-full bg-black/20 border border-white/10 rounded-lg px-2 py-2.5 text-sm focus:outline-none focus:border-emerald-500/50 text-slate-200">
                <option value="none" selected>ندارد</option>
                <option value="daily">روزانه</option>
                <option value="weekly">هفتگی</option>
                <option value="monthly">ماهانه</option>
              </select>
            </div>
          </div>
        </div>

        <div>
          <label class="flex items-center gap-2 text-sm font-medium text-slate-300 mb-2">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
            توضیحات تکمیلی
          </label>
          <textarea id="desc" rows="2" placeholder="جزئیات بیشتر..." class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 text-white placeholder-slate-600 transition-all"></textarea>
        </div>

        <button id="submit-btn" type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/25 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span>ثبت وظیفه جدید</span>
        </button>
      </form>
    </div>

    <!-- لیست یادآورها -->
    <div id="loading" class="text-center text-emerald-400 text-sm hidden mb-6 animate-pulse font-medium bg-emerald-500/10 py-2 rounded-lg border border-emerald-500/20">در حال همگام‌سازی با سرور...</div>
    <div id="reminders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
    const recurringLabels = { none: 'بدون تکرار', daily: 'روزانه', weekly: 'هفتگی', monthly: 'ماهانه' };
    
    let currentChatId = localStorage.getItem('user_chat_id');
    let editingId = null; 
    let currentData = [];

    function initDatePicker(d = new Date()) {
      const j = jalaali.toJalaali(d);
      document.getElementById('j-day').innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i+1}" ${i+1 === j.jd ? 'selected' : ''}>${i+1}</option>`).join('');
      document.getElementById('j-month').innerHTML = monthNames.map((m, i) => `<option value="${i+1}" ${i+1 === j.jm ? 'selected' : ''}>${m}</option>`).join('');
      document.getElementById('j-year').innerHTML = Array.from({length: 10}, (_, i) => `<option value="${j.jy - 2 + i}" ${j.jy - 2 + i === j.jy ? 'selected' : ''}>${j.jy - 2 + i}</option>`).join('');
      document.getElementById('j-hour').innerHTML = Array.from({length: 24}, (_, i) => `<option value="${i}" ${i === d.getHours() ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
      document.getElementById('j-minute').innerHTML = Array.from({length: 60}, (_, i) => `<option value="${i}" ${i === d.getMinutes() ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
    }

    if (currentChatId) { 
      initDatePicker(); 
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      fetchReminders();
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function login() {
      const input = document.getElementById('chat-id-input').value.trim();
      if (!input) return alert('شناسه وارد نشده است');
      currentChatId = input; 
      localStorage.setItem('user_chat_id', currentChatId);
      window.location.reload();
    }
    
    function logout() { localStorage.removeItem('user_chat_id'); window.location.reload(); }

    async function apiCall(method, body = null) {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const res = await fetch(`/api/reminders?chat_id=${currentChatId}`, {
          method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : null
        });
        document.getElementById('loading').classList.add('hidden');
        return await res.json();
      } catch (err) {
        document.getElementById('loading').classList.add('hidden'); 
        alert('خطا در ارتباط با سرور'); return null;
      }
    }

    async function fetchReminders() {
      const reminders = await apiCall('GET');
      if(reminders) { currentData = reminders; render(reminders); }
    }

    async function saveReminder(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="animate-pulse">در حال ذخیره...</span>';
      
      const jy = parseInt(document.getElementById('j-year').value);
      const jm = parseInt(document.getElementById('j-month').value);
      const jd = parseInt(document.getElementById('j-day').value);
      const h = parseInt(document.getElementById('j-hour').value);
      const m = parseInt(document.getElementById('j-minute').value);
      const gregorian = jalaali.toGregorian(jy, jm, jd);
      const targetDate = new Date(gregorian.gy, gregorian.gm - 1, gregorian.gd, h, m);

      const payload = {
        action: editingId ? 'edit' : 'add',
        id: editingId,
        title: document.getElementById('title').value,
        datetime: targetDate.toISOString(),
        priority: document.getElementById('priority').value,
        advanceNotice: parseInt(document.getElementById('advance').value),
        recurring: document.getElementById('recurring').value,
        desc: document.getElementById('desc').value,
      };

      const res = await apiCall('POST', payload);
      if (res && res.success) {
        currentData = res.reminders;
        render(currentData);
        cancelEdit();
      } else {
        btn.innerHTML = originalText;
      }
    }

    function editReminder(id) {
      const r = currentData.find(x => x.id === id);
      if(!r) return;
      
      editingId = id;
      document.getElementById('title').value = r.title;
      document.getElementById('desc').value = r.desc || '';
      document.getElementById('priority').value = r.priority || 'medium';
      document.getElementById('advance').value = r.advanceNotice || 0;
      document.getElementById('recurring').value = r.recurring || 'none';
      initDatePicker(new Date(r.datetime)); 

      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span>💾 ذخیره تغییرات</span>';
      btn.classList.replace('from-emerald-500', 'from-blue-500');
      btn.classList.replace('to-teal-500', 'to-indigo-500');
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('advance').value = '0';
      document.getElementById('recurring').value = 'none';
      document.getElementById('priority').value = 'medium';
      initDatePicker(); 
      
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg><span>ثبت وظیفه جدید</span>';
      btn.classList.replace('from-blue-500', 'from-emerald-500');
      btn.classList.replace('to-indigo-500', 'to-teal-500');
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    async function toggleComplete(id) { const res = await apiCall('POST', { action: 'complete', id }); if(res) { currentData = res.reminders; render(currentData); } }
    async function deleteReminder(id) { if(confirm('حذف شود؟')) { const res = await apiCall('POST', { action: 'delete', id }); if(res) { currentData = res.reminders; render(currentData); } } }

    function render(reminders) {
      const container = document.getElementById('reminders-list');
      container.innerHTML = '';
      
      if (!reminders || reminders.length === 0) {
        container.classList.remove('grid', 'md:grid-cols-2');
        return container.innerHTML = '<div class="w-full text-center py-16 bg-white/5 border border-white/5 rounded-3xl text-slate-500 flex flex-col items-center"><svg class="w-12 h-12 mb-3 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg><p>لیست وظایف شما خالی است.</p></div>';
      }
      
      container.classList.add('grid', 'md:grid-cols-2');
      const pColors = { high: 'bg-rose-500/10 text-rose-400 border-rose-500/30', medium: 'bg-amber-500/10 text-amber-400 border-amber-500/30', low: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };

      reminders.sort((a, b) => new Date(a.datetime) - new Date(b.datetime)).forEach(r => {
        const d = new Date(r.datetime);
        const j = jalaali.toJalaali(d);
        const dateStr = `${j.jy}/${String(j.jm).padStart(2, '0')}/${String(j.jd).padStart(2, '0')} - ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        
        let badges = '';
        if (r.sent) badges += '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-md">ارسال شد</span>';
        if (r.advanceNotice > 0) badges += `<span class="text-[10px] bg-blue-500/20 text-blue-300 px-2.5 py-1 rounded-md">هشدار ${r.advanceNotice} روز قبل</span>`;
        if (r.recurring && r.recurring !== 'none') badges += `<span class="text-[10px] bg-purple-500/20 text-purple-300 px-2.5 py-1 rounded-md">تکرار: ${recurringLabels[r.recurring]}</span>`;

        container.innerHTML += `
          <div class="bg-white/5 backdrop-blur-md border ${r.completed ? 'border-white/5 opacity-50' : 'border-white/10 hover:bg-white/10'} rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 group">
            <div>
              <div class="flex justify-between items-start mb-3">
                <span class="text-[10px] px-2.5 py-1 rounded-md border ${pColors[r.priority]} font-medium">${r.priority === 'high' ? 'فوری' : r.priority === 'medium' ? 'متوسط' : 'عادی'}</span>
                <div class="flex gap-1">${badges}</div>
              </div>
              <h3 class="font-bold text-lg mb-2 ${r.completed ? 'line-through text-slate-500' : 'text-white'}">${r.title}</h3>
              ${r.desc ? `<p class="text-xs text-slate-400 mb-4 line-clamp-2">${r.desc}</p>` : '<div class="h-2"></div>'}
            </div>
            
            <div class="mt-4 pt-4 border-t border-white/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div class="flex items-center gap-1.5 text-xs font-mono text-slate-300 bg-black/20 px-3 py-1.5 rounded-lg border border-white/5">
                <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${dateStr}
              </div>
              
              <div class="flex gap-1.5 w-full sm:w-auto opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="editReminder(${r.id})" class="p-2 rounded-lg bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 transition-colors" title="ویرایش"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                <button onclick="toggleComplete(${r.id})" class="p-2 rounded-lg ${r.completed ? 'bg-amber-500/10 text-amber-400 hover:bg-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20'} transition-colors" title="${r.completed ? 'بازگردانی' : 'انجام شد'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></button>
                <button onclick="deleteReminder(${r.id})" class="p-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 transition-colors" title="حذف"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
              </div>
            </div>
          </div>`;
      });
    }
  </script>
</body>
</html>
