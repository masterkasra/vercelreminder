<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یادآور ابری با تلگرام (شمسی)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- صفحه لاگین -->
  <div id="login-screen" class="w-full max-w-sm bg-slate-800 p-8 rounded-2xl shadow-xl text-center border border-slate-700">
    <h2 class="text-xl font-bold text-emerald-400 mb-2">ورود به سیستم</h2>
    <p class="text-xs text-slate-400 mb-6">شناسه عددی (Chat ID) تلگرام خود را وارد کنید</p>
    <input id="chat-id-input" type="number" placeholder="مثال: 123456789" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 mb-4 focus:outline-none focus:border-emerald-500 text-slate-100" />
    <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition-colors">ورود امن</button>
  </div>

  <!-- صفحه اصلی اپلیکیشن -->
  <div id="app-screen" class="w-full max-w-4xl hidden pb-10 mt-10">
    <header class="flex justify-between items-center mb-8 pt-4 pb-4 border-b border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">یادآور ابری پیشرفته</h1>
        <p class="text-xs text-slate-400 mt-1">متصل به تلگرام، دارای چت دوطرفه و کارهای دوره‌ای</p>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-rose-400 hover:bg-slate-700 border border-slate-700 transition-colors">خروج از سیستم</button>
    </header>

    <!-- فرم ثبت/ویرایش یادآور -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-lg relative">
      <!-- دکمه انصراف از ویرایش -->
      <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden absolute top-4 left-4 text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition-colors">انصراف از ویرایش ✖</button>
      
      <form onsubmit="saveReminder(event)" class="space-y-5">
        <div>
          <label class="block text-sm text-slate-300 mb-1">عنوان یادآور</label>
          <input id="title" type="text" required placeholder="مثال: پرداخت اجاره خانه" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100" />
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
          <!-- تاریخ شمسی -->
          <div>
            <label class="block text-sm text-slate-300 mb-1">تاریخ (شمسی)</label>
            <div class="flex gap-1">
              <select id="j-day" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500"></select>
              <select id="j-month" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500"></select>
              <select id="j-year" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500"></select>
            </div>
          </div>
          
          <!-- ساعت -->
          <div>
            <label class="block text-sm text-slate-300 mb-1">ساعت یادآوری</label>
            <div class="flex gap-1 items-center">
              <select id="j-hour" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500"></select>
              <span class="text-slate-400 font-bold">:</span>
              <select id="j-minute" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 text-center text-sm focus:outline-none focus:border-emerald-500"></select>
            </div>
          </div>
          
          <!-- پیش‌هشدار -->
          <div>
            <label class="block text-sm text-slate-300 mb-1">پیش‌هشدار تلگرام</label>
            <select id="advance" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-emerald-500">
              <option value="0" selected>فقط سر وقت</option>
              <option value="1">۱ روز قبل</option>
              <option value="3">۳ روز قبل</option>
              <option value="5">۵ روز قبل</option>
              <option value="7">۱ هفته قبل</option>
            </select>
          </div>
          
          <!-- تکرار دوره‌ای -->
          <div>
            <label class="block text-sm text-slate-300 mb-1">تکرار دوره‌ای</label>
            <select id="recurring" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-emerald-500">
              <option value="none" selected>بدون تکرار</option>
              <option value="daily">روزانه</option>
              <option value="weekly">هفتگی</option>
              <option value="monthly">ماهانه</option>
            </select>
          </div>
          
          <!-- اولویت -->
          <div>
            <label class="block text-sm text-slate-300 mb-1">اولویت</label>
            <select id="priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-emerald-500">
              <option value="low">عادی (سبز)</option>
              <option value="medium" selected>متوسط (زرد)</option>
              <option value="high">فوری (قرمز)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm text-slate-300 mb-1">توضیحات (اختیاری)</label>
          <textarea id="desc" rows="2" placeholder="جزییات بیشتر در صورت نیاز..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100"></textarea>
        </div>

        <button id="submit-btn" type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg shadow-lg shadow-emerald-900/30 transition-all">
          ثبت یادآور جدید
        </button>
      </form>
    </div>

    <!-- لیست یادآورها -->
    <div id="loading" class="text-center text-emerald-500 text-sm hidden mb-4 animate-pulse">در حال ارتباط با دیتابیس ابری...</div>
    <div id="reminders-list" class="space-y-4"></div>
  </div>

  <script>
    const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
    const recurringLabels = { none: 'بدون تکرار', daily: 'روزانه', weekly: 'هفتگی', monthly: 'ماهانه' };
    
    let currentChatId = localStorage.getItem('user_chat_id');
    let editingId = null; 
    let currentData = [];

    // مقداردهی اولیه تقویم شمسی
    function initDatePicker(d = new Date()) {
      const j = jalaali.toJalaali(d);
      const now = new Date();
      document.getElementById('j-day').innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i+1}" ${i+1 === j.jd ? 'selected' : ''}>${i+1}</option>`).join('');
      document.getElementById('j-month').innerHTML = monthNames.map((m, i) => `<option value="${i+1}" ${i+1 === j.jm ? 'selected' : ''}>${m}</option>`).join('');
      document.getElementById('j-year').innerHTML = Array.from({length: 10}, (_, i) => `<option value="${j.jy - 2 + i}" ${j.jy - 2 + i === j.jy ? 'selected' : ''}>${j.jy - 2 + i}</option>`).join('');
      document.getElementById('j-hour').innerHTML = Array.from({length: 24}, (_, i) => `<option value="${i}" ${i === d.getHours() ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
      document.getElementById('j-minute').innerHTML = Array.from({length: 60}, (_, i) => `<option value="${i}" ${i === d.getMinutes() ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
    }

    if (currentChatId) { initDatePicker(); showApp(); }

    function login() {
      const input = document.getElementById('chat-id-input').value.trim();
      if (!input) return alert('شناسه Chat ID وارد نشده است');
      currentChatId = input; 
      localStorage.setItem('user_chat_id', currentChatId);
      initDatePicker(); 
      showApp();
    }
    
    function logout() { 
      localStorage.removeItem('user_chat_id'); 
      window.location.reload(); 
    }
    
    function showApp() { 
      document.getElementById('login-screen').classList.add('hidden'); 
      document.getElementById('app-screen').classList.remove('hidden'); 
      fetchReminders(); 
    }

    async function apiCall(method, body = null) {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const res = await fetch(`/api/reminders?chat_id=${currentChatId}`, {
          method, 
          headers: { 'Content-Type': 'application/json' }, 
          body: body ? JSON.stringify(body) : null
        });
        document.getElementById('loading').classList.add('hidden');
        return await res.json();
      } catch (err) {
        document.getElementById('loading').classList.add('hidden'); 
        alert('خطا در ارتباط با سرور');
        return null;
      }
    }

    async function fetchReminders() {
      const reminders = await apiCall('GET');
      if(reminders) { 
        currentData = reminders; 
        render(reminders); 
      }
    }

    async function saveReminder(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'در حال ذخیره...';
      
      const jy = parseInt(document.getElementById('j-year').value);
      const jm = parseInt(document.getElementById('j-month').value);
      const jd = parseInt(document.getElementById('j-day').value);
      const h = parseInt(document.getElementById('j-hour').value);
      const m = parseInt(document.getElementById('j-minute').value);
      
      // تبدیل تاریخ شمسی انتخاب شده به میلادی استاندارد (ISO)
      const gregorian = jalaali.toGregorian(jy, jm, jd);
      const targetDate = new Date(gregorian.gy, gregorian.gm - 1, gregorian.gd, h, m);

      const payload = {
        action: editingId ? 'edit' : 'add',
        id: editingId,
        title: document.getElementById('title').value,
        datetime: targetDate.toISOString(),
        priority: document.getElementById('priority').value,
        advanceNotice: parseInt(document.getElementById('advance').value),
        recurring: document.getElementById('recurring').value,
        desc: document.getElementById('desc').value,
      };

      const res = await apiCall('POST', payload);
      if (res && res.success) {
        currentData = res.reminders;
        render(currentData);
        cancelEdit(); // فرم را پاکسازی و ریست می‌کند
      }
    }

    function editReminder(id) {
      const r = currentData.find(x => x.id === id);
      if(!r) return;
      
      editingId = id;
      document.getElementById('title').value = r.title;
      document.getElementById('desc').value = r.desc || '';
      document.getElementById('priority').value = r.priority || 'medium';
      document.getElementById('advance').value = r.advanceNotice || 0;
      document.getElementById('recurring').value = r.recurring || 'none';
      
      // تقویم را روی زمان یادآور در حال ویرایش تنظیم می‌کند
      initDatePicker(new Date(r.datetime)); 

      const btn = document.getElementById('submit-btn');
      btn.textContent = '💾 ذخیره تغییرات';
      btn.classList.replace('bg-emerald-600', 'bg-blue-600');
      btn.classList.replace('hover:bg-emerald-500', 'hover:bg-blue-500');
      btn.classList.replace('shadow-emerald-900/30', 'shadow-blue-900/30');
      
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('advance').value = '0';
      document.getElementById('recurring').value = 'none';
      document.getElementById('priority').value = 'medium';
      
      // تقویم را به زمان حال برمی‌گرداند
      initDatePicker(); 
      
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'ثبت یادآور جدید';
      btn.classList.replace('bg-blue-600', 'bg-emerald-600');
      btn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
      btn.classList.replace('shadow-blue-900/30', 'shadow-emerald-900/30');
      
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    async function toggleComplete(id) { 
      const res = await apiCall('POST', { action: 'complete', id }); 
      if(res) { currentData = res.reminders; render(currentData); } 
    }
    
    async function deleteReminder(id) { 
      if(confirm('آیا از حذف این یادآور اطمینان دارید؟')) { 
        const res = await apiCall('POST', { action: 'delete', id }); 
        if(res) { currentData = res.reminders; render(currentData); } 
      } 
    }

    // رندر کردن لیست یادآورها
    function render(reminders) {
      const container = document.getElementById('reminders-list');
      container.innerHTML = '';
      
      if (!reminders || reminders.length === 0) {
        return container.innerHTML = '<div class="text-center py-12 text-slate-500 border border-dashed border-slate-700 rounded-xl">هیچ یادآوری یافت نشد. لیست شما خالی است.</div>';
      }
      
      const priorityStyle = { 
        high: 'border-rose-500/60 bg-rose-950/20 text-rose-400', 
        medium: 'border-amber-500/60 bg-amber-950/20 text-amber-400', 
        low: 'border-emerald-500/60 bg-emerald-950/20 text-emerald-400' 
      };

      // مرتب‌سازی یادآورها بر اساس نزدیک‌ترین زمان
      reminders.sort((a, b) => new Date(a.datetime) - new Date(b.datetime)).forEach(r => {
        const d = new Date(r.datetime);
        const j = jalaali.toJalaali(d);
        const dateStr = `${j.jy}/${String(j.jm).padStart(2, '0')}/${String(j.jd).padStart(2, '0')} - ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        
        // ساخت تگ‌های اطلاع‌رسانی زیر عنوان
        let tagsHTML = '';
        if (r.sent) tagsHTML += '<span class="text-[10px] bg-emerald-900/40 border border-emerald-800 text-emerald-400 px-2 py-0.5 rounded mr-1">ارسال شد</span>';
        if (r.advanceNotice > 0) tagsHTML += `<span class="text-[10px] bg-blue-900/40 border border-blue-800 text-blue-400 px-2 py-0.5 rounded mr-1">هشدار ${r.advanceNotice} روز قبل ${r.advanceSent ? '(انجام شد)' : ''}</span>`;
        if (r.recurring && r.recurring !== 'none') tagsHTML += `<span class="text-[10px] bg-purple-900/40 border border-purple-800 text-purple-400 px-2 py-0.5 rounded mr-1">🔄 تکرار: ${recurringLabels[r.recurring]}</span>`;

        container.innerHTML += `
          <div class="border rounded-xl p-4 md:p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all ${r.completed ? 'bg-slate-900/50 border-slate-800 opacity-50' : 'bg-slate-800/80 border-slate-700 hover:border-slate-600'}">
            
            <div class="w-full">
              <div class="flex items-center flex-wrap gap-2 mb-2">
                <span class="text-[10px] px-2 py-0.5 rounded border ${priorityStyle[r.priority]}">${r.priority === 'high' ? 'فوری' : r.priority === 'medium' ? 'متوسط' : 'عادی'}</span>
                <h3 class="font-medium text-lg ${r.completed ? 'line-through text-slate-500' : 'text-slate-100'}">${r.title}</h3>
              </div>
              <div class="flex flex-wrap gap-1 mt-1">${tagsHTML}</div>
              ${r.desc ? `<p class="text-xs text-slate-400 mt-2 bg-slate-900/50 p-2 rounded-lg border border-slate-700/50">${r.desc}</p>` : ''}
              <div class="text-xs text-slate-300 mt-3 font-mono bg-slate-900 px-2 py-1.5 rounded-lg inline-block border border-slate-700">⏰ سررسید: ${dateStr}</div>
            </div>
            
            <div class="flex flex-wrap gap-2 w-full md:w-auto self-end md:self-center mt-3 md:mt-0">
              <button onclick="editReminder(${r.id})" class="px-4 py-2 text-xs rounded-lg border border-blue-900/80 hover:bg-blue-900/60 text-blue-400 transition-colors flex-1 md:flex-none">ویرایش</button>
              <button onclick="toggleComplete(${r.id})" class="px-4 py-2 text-xs rounded-lg border border-slate-600 hover:bg-slate-700 text-slate-300 transition-colors flex-1 md:flex-none">${r.completed ? 'بازگردانی' : 'انجام شد'}</button>
              <button onclick="deleteReminder(${r.id})" class="px-4 py-2 text-xs rounded-lg border border-rose-900/80 hover:bg-rose-900/50 text-rose-400 transition-colors flex-1 md:flex-none">حذف</button>
            </div>
          </div>`;
      });
    }
  </script>
</body>
</html>
