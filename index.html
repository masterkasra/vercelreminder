<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030712" id="meta-theme-color" />
  <link rel="manifest" href="/manifest.json" />
  <title>Nirvana | Enterprise Cloud Assistant</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: {} } }</script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    body { font-family: 'Vazirmatn', system-ui, sans-serif; overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
    .glass-panel { transition: all 0.4s ease; }
    .dark .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
    
    .dark .input-premium { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.05); color: #fff; }
    .input-premium { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1); color: #0f172a; transition: all 0.3s ease; }
    .input-premium:focus { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); outline: none; }
    
    .btn-ai { background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); background-size: 200% 200%; animation: gradientShift 5s ease infinite; border: none; }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    .animate-heartbeat { display: inline-block; animation: heartbeat 1.2s ease-in-out infinite; }
    .progress-bar-fill { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    
    ::-webkit-scrollbar { width: 5px; } 
    ::-webkit-scrollbar-track { background: transparent; } 
    .dark ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .mic-pulse { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse-red 1.5s infinite cubic-bezier(0.66, 0, 0, 1); }
    @keyframes pulse-red { to { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-day { padding: 8px; min-height: 80px; border-radius: 12px; transition: all 0.2s; cursor: pointer; }
    .dark .calendar-day { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
    .calendar-day { background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
    .calendar-day:hover { transform: scale(1.02); }
    .dark .calendar-day.active-day { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.4); }
    .calendar-day.active-day { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center selection:bg-emerald-500/30 pb-24 bg-slate-50 text-slate-800 dark:bg-[#030712] dark:text-slate-100">

  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-2xl h-[500px] bg-emerald-400/20 dark:bg-emerald-900/20 blur-[120px] dark:blur-[150px] rounded-full pointer-events-none -z-10 transition-all duration-700"></div>

  <!-- Pomodoro Modal -->
  <div id="pomo-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 dark:bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
    <div class="glass-panel p-8 rounded-3xl max-w-sm w-full text-center relative">
      <button onclick="closePomo()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-800 dark:hover:text-white">✖</button>
      <h3 class="text-xl font-bold text-emerald-600 dark:text-emerald-500 mb-2" data-i18n="pomo_title">تایمر تمرکز</h3>
      <p id="pomo-task-name" class="text-sm text-slate-500 dark:text-slate-400 mb-4 truncate"></p>
      <div class="flex justify-center items-center gap-2 mb-4">
        <label class="text-xs font-bold text-slate-500 dark:text-slate-400" data-i18n="pomo_custom_mins">زمان (دقیقه):</label>
        <input type="number" id="pomo-custom-time" value="25" min="1" max="120" onchange="updatePomoDisplayFromInput()" class="w-16 text-center input-premium rounded-lg px-2 py-1 font-bold text-emerald-500" />
      </div>
      <div class="relative w-48 h-48 mx-auto mb-8 flex items-center justify-center rounded-full border-4 border-emerald-500/20 bg-emerald-500/5 shadow-[0_0_40px_rgba(16,185,129,0.1)]">
        <span id="pomo-timer-display" class="text-5xl font-mono font-bold text-slate-800 dark:text-white tracking-widest">25:00</span>
      </div>
      <div class="flex justify-center gap-3">
        <button onclick="startPomo()" class="bg-emerald-500 text-white dark:text-black px-6 py-3 rounded-xl font-bold flex-1 hover:bg-emerald-600 dark:hover:bg-emerald-400 transition-colors" data-i18n="pomo_start">شروع</button>
        <button onclick="resetPomo()" class="bg-slate-200 dark:bg-white/10 text-slate-800 dark:text-white px-6 py-3 rounded-xl font-bold flex-1 hover:bg-slate-300 dark:hover:bg-white/20 transition-colors" data-i18n="pomo_reset">توقف</button>
      </div>
    </div>
  </div>

  <div id="tour-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 dark:bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div class="glass-panel p-8 rounded-3xl max-w-lg w-full transform scale-95 transition-transform duration-300" id="tour-content"></div>
  </div>

  <!-- AUTHENTICATION SCREEN -->
  <div id="auth-screen" class="w-full max-w-md mt-16 p-6 hidden">
    <div class="glass-panel p-8 sm:p-10 rounded-[2.5rem] relative overflow-hidden group">
      <div class="w-20 h-20 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(16,185,129,0.2)]">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      
      <div class="flex bg-black/5 dark:bg-white/5 rounded-xl p-1 mb-8">
        <button id="auth-login-tab" onclick="switchAuthTab('login')" class="flex-1 px-4 py-2 text-sm font-bold rounded-lg bg-white dark:bg-white/10 text-slate-800 dark:text-white shadow transition-all">ورود</button>
        <button id="auth-reg-tab" onclick="switchAuthTab('register')" class="flex-1 px-4 py-2 text-sm font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all">ایجاد حساب</button>
      </div>

      <div id="auth-loading" class="hidden text-center text-emerald-500 text-sm font-bold animate-pulse mb-4">در حال پردازش...</div>

      <form id="login-form" onsubmit="handleAuth(event, 'login')" class="space-y-4">
        <input type="email" id="login-email" required placeholder="ایمیل" class="w-full input-premium rounded-xl px-4 py-3.5 text-sm" />
        <input type="password" id="login-password" required placeholder="رمز عبور" class="w-full input-premium rounded-xl px-4 py-3.5 text-sm" />
        <button type="submit" class="w-full bg-slate-900 text-white dark:bg-white dark:text-black font-bold py-4 rounded-xl shadow-lg mt-4 hover:-translate-y-1 transition-all">ورود به سیستم</button>
      </form>

      <form id="register-form" onsubmit="handleAuth(event, 'register')" class="space-y-4 hidden">
        <div class="flex gap-2"><input type="text" id="reg-fname" required placeholder="نام" class="w-1/2 input-premium rounded-xl px-4 py-3 text-sm" /><input type="text" id="reg-lname" required placeholder="نام خانوادگی" class="w-1/2 input-premium rounded-xl px-4 py-3 text-sm" /></div>
        <input type="email" id="reg-email" required placeholder="ایمیل" class="w-full input-premium rounded-xl px-4 py-3 text-sm" />
        <input type="password" id="reg-password" required placeholder="رمز عبور (کلید مخفی شما)" class="w-full input-premium rounded-xl px-4 py-3 text-sm" />
        <input type="tel" id="reg-phone" placeholder="شماره تماس" class="w-full input-premium rounded-xl px-4 py-3 text-sm" />
        <div class="flex gap-2"><input type="text" id="reg-job" placeholder="شغل" class="w-1/2 input-premium rounded-xl px-4 py-3 text-sm" /><input type="text" id="reg-country" placeholder="کشور" class="w-1/2 input-premium rounded-xl px-4 py-3 text-sm" /></div>
        <div class="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl mt-2">
          <label class="block text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-2">شناسه تلگرام (Chat ID):</label>
          <input type="number" id="reg-chatid" required placeholder="مثال: 123456789" class="w-full input-premium rounded-lg px-3 py-2 text-sm" />
        </div>
        <button type="submit" class="w-full bg-emerald-500 text-white dark:text-black font-bold py-4 rounded-xl shadow-lg mt-4 hover:bg-emerald-400 hover:-translate-y-1 transition-all">ثبت‌نام و ورود</button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="app-screen" class="w-full max-w-4xl hidden px-4 sm:px-6 flex-grow">
    
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-6 gap-4 border-b border-black/5 dark:border-white/5 mb-6">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-800 dark:text-white"><span data-i18n="app_title">یادآور ابری هوشمند</span> <span id="welcome-name" class="text-emerald-500 text-lg ml-2"></span></h1>
          <div class="flex items-center gap-2 mt-1" id="sync-status">
            <span class="flex w-2 h-2 bg-emerald-500 rounded-full animate-pulse" id="sync-dot"></span>
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400" id="sync-text" data-i18n="sync_online">متصل و همگام</span>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-2 self-end sm:self-center">
        <div class="flex bg-black/5 dark:bg-white/5 rounded-xl p-1">
          <button id="view-list-btn" onclick="switchView('list')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white dark:bg-white/10 text-slate-800 dark:text-white shadow" data-i18n="view_list">لیست</button>
          <button id="view-cal-btn" onclick="switchView('calendar')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all" data-i18n="view_cal">تقویم</button>
        </div>
        <select id="lang-select" onchange="changeLanguage(this.value)" class="glass-panel text-xs rounded-xl px-3 py-2.5 outline-none font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
          <option value="fa">🇮🇷 فا</option><option value="en">🇬🇧 EN</option><option value="de">🇩🇪 DE</option>
        </select>
        <button onclick="toggleTheme()" class="p-2.5 rounded-xl glass-panel text-slate-700 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition-all" title="Toggle Theme">
          <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button onclick="logout()" class="p-2.5 rounded-xl glass-panel hover:bg-rose-500/10 text-rose-500 transition-all" title="Logout"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></button>
      </div>
    </header>

    <div class="glass-panel rounded-3xl p-5 mb-8 flex flex-col sm:flex-row items-center gap-6 relative">
      <div class="w-16 h-16 rounded-full bg-emerald-500/10 border-2 border-emerald-500/30 flex items-center justify-center flex-shrink-0">
        <span class="text-2xl" id="level-emoji">🌱</span>
      </div>
      <div class="w-full flex-grow">
        <div class="flex justify-between items-end mb-2">
          <div>
            <p class="text-[10px] sm:text-xs font-bold uppercase tracking-wider mb-1 text-slate-500 dark:text-slate-400" data-i18n="prod_level">سطح بهره‌وری شما</p>
            <h3 class="text-lg font-bold text-emerald-600 dark:text-emerald-400" id="level-title" data-i18n="level_start">شروع مسیر</h3>
          </div>
          <div class="text-right flex items-baseline gap-1">
            <span class="text-2xl font-black text-slate-800 dark:text-white" id="tasks-done">0</span>
            <span class="text-xs sm:text-sm text-slate-500">/ <span id="tasks-total">0</span> <span data-i18n="done_text">انجام شده</span></span>
          </div>
        </div>
        <div class="w-full h-2 bg-black/10 dark:bg-black/40 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 progress-bar-fill" style="width: 0%"></div>
        </div>
      </div>
      <button onclick="exportAnalyticsPDF()" class="absolute top-4 left-4 sm:relative sm:top-0 sm:left-0 bg-blue-500/10 text-blue-600 dark:text-blue-400 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs font-bold hover:bg-blue-500/20 transition-colors flex items-center gap-2 border border-blue-500/20" title="PDF Export">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="hidden sm:inline" data-i18n="export_pdf">دانلود گزارش</span>
      </button>
    </div>

    <!-- Creation Panel -->
    <div id="creation-panel" class="glass-panel rounded-[2rem] p-6 sm:p-8 mb-8 relative z-10">
      <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden absolute top-6 left-6 text-xs bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded-lg transition-colors z-20" data-i18n="cancel_edit">لغو ویرایش ✖</button>
      
      <div class="flex gap-2 mb-6 bg-black/5 dark:bg-black/30 p-1 rounded-xl w-fit">
        <button id="tab-manual" onclick="switchTab('manual')" class="px-4 py-2 text-sm font-bold rounded-lg bg-white dark:bg-white/10 text-slate-800 dark:text-white shadow" data-i18n="tab_manual">ثبت دستی</button>
        <button id="tab-ai" onclick="switchTab('ai')" class="px-4 py-2 text-sm font-bold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white flex items-center gap-1.5 transition-all">
          <svg class="w-4 h-4 text-purple-500 dark:text-purple-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11H9v-2h2v2zm0-4H9V5h2v4z"></path></svg> <span data-i18n="tab_ai">هوش مصنوعی</span>
        </button>
      </div>

      <!-- AI Form with VOICE -->
      <div id="ai-form" class="hidden space-y-4">
        <div class="relative flex flex-col md:flex-row gap-4 items-stretch">
          <textarea id="ai-input" rows="3" class="w-full input-premium rounded-2xl px-5 py-4 text-lg resize-none flex-grow" data-placeholder="ai_placeholder" placeholder="مثال: فردا عصر به مدیرم ایمیل بزنم..."></textarea>
          <button id="mic-btn" onclick="startVoiceRecognition()" class="flex md:flex-col justify-center items-center gap-2 px-6 py-4 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 rounded-2xl transition-all text-slate-600 dark:text-slate-300 font-bold">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            <span id="mic-text" class="text-sm" data-i18n="btn_mic">صحبت کنید</span>
          </button>
        </div>
        
        <button id="ai-btn" onclick="processAI()" class="w-full btn-ai text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-transform hover:scale-[1.01] flex justify-center items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> <span id="ai-btn-text" data-i18n="ai_btn">پردازش با هوش مصنوعی</span>
        </button>
      </div>

      <!-- Manual Form -->
      <form id="manual-form" onsubmit="saveReminder(event)" class="space-y-5">
        <input id="title" type="text" required class="w-full bg-transparent border-b border-black/10 dark:border-white/10 focus:border-emerald-500 px-2 py-3 text-xl focus:outline-none transition-colors font-bold text-slate-800 dark:text-white" data-placeholder="title_placeholder" placeholder="عنوان وظیفه..." />
        
        <div class="flex justify-between items-center flex-wrap gap-4">
          <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide flex-grow">
            <label class="text-xs self-center text-slate-500 dark:text-slate-400 ml-2" data-i18n="category">دسته‌بندی:</label>
            <label class="cursor-pointer flex-shrink-0"><input type="radio" name="tag" value="work" checked class="peer hidden"><span class="px-3 py-1.5 text-xs rounded-full border border-black/10 dark:border-white/10 peer-checked:bg-blue-500/20 peer-checked:text-blue-600 dark:peer-checked:text-blue-300 text-slate-600 dark:text-slate-400 transition-all" data-i18n="tag_work">💼 کاری</span></label>
            <label class="cursor-pointer flex-shrink-0"><input type="radio" name="tag" value="personal" class="peer hidden"><span class="px-3 py-1.5 text-xs rounded-full border border-black/10 dark:border-white/10 peer-checked:bg-orange-500/20 peer-checked:text-orange-600 dark:peer-checked:text-orange-300 text-slate-600 dark:text-slate-400 transition-all" data-i18n="tag_personal">🏠 شخصی</span></label>
            <label class="cursor-pointer flex-shrink-0"><input type="radio" name="tag" value="finance" class="peer hidden"><span class="px-3 py-1.5 text-xs rounded-full border border-black/10 dark:border-white/10 peer-checked:bg-emerald-500/20 peer-checked:text-emerald-600 dark:peer-checked:text-emerald-300 text-slate-600 dark:text-slate-400 transition-all" data-i18n="tag_finance">💳 مالی</span></label>
            <label class="cursor-pointer flex-shrink-0"><input type="radio" name="tag" value="dev" class="peer hidden"><span class="px-3 py-1.5 text-xs rounded-full border border-black/10 dark:border-white/10 peer-checked:bg-purple-500/20 peer-checked:text-purple-600 dark:peer-checked:text-purple-300 text-slate-600 dark:text-slate-400 transition-all" data-i18n="tag_dev">📚 توسعه</span></label>
            <label class="cursor-pointer flex-shrink-0"><input type="radio" name="tag" value="general" class="peer hidden"><span class="px-3 py-1.5 text-xs rounded-full border border-black/10 dark:border-white/10 peer-checked:bg-pink-500/20 peer-checked:text-pink-600 dark:peer-checked:text-pink-300 text-slate-600 dark:text-slate-400 transition-all" data-i18n="tag_general">🎯 عمومی</span></label>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="lg:col-span-2 bg-black/5 dark:bg-black/20 p-3 rounded-2xl flex flex-col justify-center border border-black/5 dark:border-white/5">
            <div class="flex justify-between px-1 mb-1">
              <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400" data-i18n="lbl_date">تاریخ سررسید</span>
              <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400" data-i18n="lbl_time">ساعت یادآوری</span>
            </div>
            <div class="flex flex-wrap gap-2">
              <select id="t-day" class="flex-1 input-premium rounded-lg px-2 py-2 text-center text-sm appearance-none"></select>
              <select id="t-month" class="flex-1 input-premium rounded-lg px-2 py-2 text-center text-sm appearance-none"></select>

    function initSettings() { document.getElementById('lang-select').value = currentLang; applyTheme(); applyLanguage(); }
    function toggleTheme() { isDark = !isDark; localStorage.setItem('nirvana_theme', isDark ? 'dark' : 'light'); applyTheme(); }
    function applyTheme() {
      const html = document.documentElement; const icon = document.getElementById('theme-icon');
      if (isDark) { html.classList.add('dark'); document.getElementById('meta-theme-color').content = "#030712"; icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'; } 
      else { html.classList.remove('dark'); document.getElementById('meta-theme-color').content = "#f8fafc"; icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>'; }
    }
    function changeLanguage(lang) { currentLang = lang; localStorage.setItem('nirvana_lang', lang); applyLanguage(); initDatePicker(); if(currentData.length>0){renderList(); renderCalendar();} }
    function t(key) { return translations[currentLang][key] || key; }
    function applyLanguage() {
      document.documentElement.lang = currentLang; document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.getAttribute('data-i18n')));
      document.querySelectorAll('[data-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-placeholder')));
      document.getElementById('cal-headers').innerHTML = t('days').map(d => `<div>${d}</div>`).join('');
    }

    // --- 2. SECURITY (E2EE READ-ONLY FOR OLD TASKS) & AUTH ---
    let currentUser = JSON.parse(localStorage.getItem('nirvana_user'));
    if (!currentUser && localStorage.getItem('user_chat_id')) { currentUser = { email: "legacy", password: localStorage.getItem('user_chat_id'), chatId: localStorage.getItem('user_chat_id'), firstName: "کاربر" }; }
    let currentChatId = currentUser ? currentUser.chatId : null;
    let currentData = JSON.parse(localStorage.getItem('nirvana_tasks_cache')) || [];
    let offlineQueue = JSON.parse(localStorage.getItem('nirvana_sync_queue')) || [];
    let currentFilter = 'all'; let editingId = null; let tempSubtasks = []; let tempAttachment = null;

    function getSecret() { return (currentUser && currentUser.password) ? currentUser.password : "NirvanaSecretKey"; }
    function decryptText(cipher) {
      if(!cipher) return "";
      try { const bytes = CryptoJS.AES.decrypt(cipher, getSecret()); return bytes.toString(CryptoJS.enc.Utf8) || "🔒 Encrypted"; } 
      catch(e) { return "🔒 Encrypted"; }
    }

    function switchAuthTab(tab) {
      if (tab === 'login') { document.getElementById('login-form').classList.remove('hidden'); document.getElementById('register-form').classList.add('hidden'); document.getElementById('auth-login-tab').className = "flex-1 px-4 py-2 text-sm font-bold rounded-lg bg-white dark:bg-white/10 text-slate-800 dark:text-white shadow transition-all"; document.getElementById('auth-reg-tab').className = "flex-1 px-4 py-2 text-sm font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all"; } 
      else { document.getElementById('login-form').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); document.getElementById('auth-reg-tab').className = "flex-1 px-4 py-2 text-sm font-bold rounded-lg bg-white dark:bg-white/10 text-slate-800 dark:text-white shadow transition-all"; document.getElementById('auth-login-tab').className = "flex-1 px-4 py-2 text-sm font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all"; }
    }

    async function handleAuth(e, action) {
      e.preventDefault(); document.getElementById('auth-loading').classList.remove('hidden');
      let payload = { action };
      if (action === 'login') { payload.email = document.getElementById('login-email').value; payload.password = document.getElementById('login-password').value; } 
      else { payload.email = document.getElementById('reg-email').value; payload.password = document.getElementById('reg-password').value; payload.firstName = document.getElementById('reg-fname').value; payload.lastName = document.getElementById('reg-lname').value; payload.phone = document.getElementById('reg-phone').value; payload.job = document.getElementById('reg-job').value; payload.country = document.getElementById('reg-country').value; payload.chatId = document.getElementById('reg-chatid').value; }

      try {
        const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json(); document.getElementById('auth-loading').classList.add('hidden');
        if (data.error) return alert(data.error);
        localStorage.setItem('nirvana_user', JSON.stringify(data.user)); localStorage.setItem('user_chat_id', data.user.chatId); window.location.reload();
      } catch (err) { document.getElementById('auth-loading').classList.add('hidden'); alert("Server Error."); }
    }
    
    function logout() { 
        localStorage.removeItem('nirvana_user'); 
        localStorage.removeItem('user_chat_id'); 
        localStorage.removeItem('nirvana_tasks_cache'); 
        localStorage.removeItem('nirvana_sync_queue');
        window.location.reload(); 
    }

    function handleFile(e) {
      const file = e.target.files[0]; if(!file) return;
      if(file.size > 1 * 1024 * 1024) return alert("حجم فایل نباید بیشتر از 1 مگابایت باشد.");
      const reader = new FileReader();
      reader.onload = (ev) => { tempAttachment = { name: file.name, type: file.type, data: ev.target.result }; const disp = document.getElementById('file-name-display'); disp.innerText = `📎 ${file.name}`; disp.classList.remove('hidden'); };
      reader.readAsDataURL(file);
    }

    function exportAnalyticsPDF() {
      const total = currentData.length; const done = currentData.filter(r=>r.completed).length; const pending = total - done;
      const element = document.createElement('div');
      element.innerHTML = `
        <div style="padding: 30px; font-family: Tahoma, sans-serif; direction: rtl; text-align: right; background: #fff; color: #000;">
          <h1 style="color: #10b981; border-bottom: 2px solid #10b981; padding-bottom: 10px;">گزارش عملکرد ماهانه Nirvana</h1>
          <h3>خلاصه وضعیت:</h3>
          <p>تعداد کل وظایف: <b>${total}</b></p><p>انجام شده: <b style="color:green;">${done}</b></p><p>باقی‌مانده: <b style="color:red;">${pending}</b></p>
          <p>درصد موفقیت: <b>${total ? Math.round((done/total)*100) : 0}%</b></p>
          <br><h3>لیست کارهای باقی‌مانده:</h3>
          <ul>${currentData.filter(r=>!r.completed).map(r=> `<li>${r.isEncrypted ? '🔒 [رمزنگاری شده E2EE]' : r.title} - ${r.priority}</li>`).join('')}</ul>
          <br><p style="font-size:10px; color:#888;">Generated by Nirvana.DEV</p>
        </div>`;
      html2pdf().set({ margin: 0.5, filename: 'Nirvana_Report.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(element).save();
    }

    // --- 3. SUBTASKS & POMODORO & GCAL ---
    function addTempSubtask() { const input = document.getElementById('subtask-input'); if (!input.value.trim()) return; tempSubtasks.push({ text: input.value.trim(), done: false }); input.value = ''; renderTempSubtasks(); }

    // --- 6. AI & VOICE (MOBILE FIXED & ROBUST PARSER) ---
    let recognition;
    function startVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        return alert(currentLang === 'fa' ? 'مرورگر شما از ضبط صدا پشتیبانی نمی‌کند. لطفاً در Chrome باز کنید.' : 'Voice recognition not supported. Open in Chrome.');
      }
      
      // جلوگیری از کلیک‌های تکراری
      if (recognition && document.getElementById('mic-text').innerText === 'در حال شنیدن...') return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; 
      recognition = new SpeechRecognition();
      recognition.lang = currentLang === 'fa' ? 'fa-IR' : (currentLang === 'de' ? 'de-DE' : 'en-US'); 
      recognition.interimResults = false;
      
      const btn = document.getElementById('mic-btn'); 
      const text = document.getElementById('mic-text');
      
      btn.classList.add('mic-pulse'); 
      text.innerText = currentLang === 'fa' ? 'در حال شنیدن...' : 'Listening...'; 
      
      try { 
        recognition.start(); 
      } catch (e) {
        btn.classList.remove('mic-pulse'); 
        text.innerText = t('btn_mic'); 
        console.error(e);
      }

      recognition.onresult = function(e) { 
        if(e.results && e.results[0] && e.results[0][0]) {
            document.getElementById('ai-input').value = e.results[0][0].transcript; 
            processAI(); 
        }
      };
      
      // بستن صحیح روی موبایل
      recognition.onend = function() { 
        btn.classList.remove('mic-pulse'); 
        text.innerText = t('btn_mic'); 
      };
      
      // سیستم دیباگ صوتی موبایل
      recognition.onerror = function(e) { 
        btn.classList.remove('mic-pulse'); 
        text.innerText = t('btn_mic'); 
        if (e.error === 'not-allowed') {
            alert(currentLang === 'fa' ? 'دسترسی میکروفون مسدود است! روی قفل کنار آدرس سایت بزنید و Allow کنید.' : 'Mic access blocked.');
        } else if (e.error === 'network') {
            alert(currentLang === 'fa' ? 'برای تایپ صوتی اینترنت پایدار نیاز است.' : 'Network error.');
        } else if (e.error !== 'no-speech') {
            alert(currentLang === 'fa' ? 'سیستم صوتی گوشی شما خطا داد: ' + e.error + '\n(مطمئن شوید اپلیکیشن Google در گوشی نصب و فعال است)' : 'Audio error: ' + e.error);
        }
      };
    }

    async function processAI() {
      const text = document.getElementById('ai-input').value.trim(); if (!text) return;
      document.getElementById('ai-btn').disabled = true; 
      const btnText = document.getElementById('ai-btn-text');
      btnText.innerText = t('ai_loading');
      
      const now = new Date(); const jNow = jalaali.toJalaali(now);
      
      const prompt = `You are a strict data extractor. Today's Date -> Year: ${currentLang==='fa'?jNow.jy:now.getFullYear()}, Month: ${currentLang==='fa'?jNow.jm:now.getMonth()+1}, Day: ${currentLang==='fa'?jNow.jd:now.getDate()}.
      User Input: "${text}"
      Return ONLY a pure JSON object. NO markdown, NO text outside JSON.
      Format MUST match exactly:
      {"title":"Task Name","y":2026,"m":12,"d":30,"h":12,"min":0,"priority":"medium","tag":"general"}`;
      
      try {
        let res = await fetch("/api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: prompt }) });
        let data = await res.json();
        
        if (data.error) {
            console.error("API Error:", data.error);
            alert("خطای سرور ابری: " + (data.error.message || "لطفاً API Key خود را بررسی کنید."));
            return;
        }

        if (!data.candidates || !data.candidates[0].content || !data.candidates[0].content.parts[0]) {
            throw new Error("پاسخ نامعتبر از سرور هوش مصنوعی");
        }

        let aiResult = data.candidates[0].content.parts[0].text;
        
        // Anti-crash JSON extractor
        const startIndex = aiResult.indexOf('{'); const endIndex = aiResult.lastIndexOf('}');
        if (startIndex === -1 || endIndex === -1) throw new Error("متن دریافتی قابلیت تبدیل به زمان را نداشت.");
        aiResult = aiResult.substring(startIndex, endIndex + 1);
        
        const p = JSON.parse(aiResult);
        let td; if(currentLang==='fa'){ const g=jalaali.toGregorian(p.y,p.m,p.d); td=new Date(g.gy,g.gm-1,g.gd,p.h||0,p.min||0); } else { td=new Date(p.y,p.m-1,p.d,p.h||0,p.min||0); }
        
        const payload = { action: 'add', id: Date.now(), title: p.title, datetime: td.toISOString(), priority: p.priority||'medium', advanceNotice: 0, recurring: 'none', tag: p.tag||'general', subtasks: [], desc: '', isEncrypted: false, attachment: null, completed: false };
        currentData.push(payload); renderList(); pushToQueue('POST', payload); document.getElementById('ai-input').value = ''; switchTab('manual');
      } catch (e) { 
        console.error(e);
        alert('در درک متن شما مشکلی پیش آمد. لطفاً به صورت دستی ثبت کنید.'); 
      } finally { 
        btnText.innerText = t('ai_btn'); document.getElementById('ai-btn').disabled = false; 
      }
    }

    // --- 7. BOOT & SYNC ---
    initSettings();
    if (currentUser || currentChatId) { 
      initDatePicker(); document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app-screen').classList.remove('hidden');
      if(currentUser && currentUser.firstName) { document.getElementById('welcome-name').innerText = `(${currentUser.firstName})`; }
      fetchRemindersFromServer(); updateConnectionStatus(); 
    } else { document.getElementById('auth-screen').classList.remove('hidden'); }

    function updateConnectionStatus() {
      const dot = document.getElementById('sync-dot'); const text = document.getElementById('sync-text');
      if (navigator.onLine) { dot.className = 'flex w-2 h-2 bg-emerald-500 rounded-full animate-pulse'; text.innerText = t('sync_online'); processSyncQueue(); } 
      else { dot.className = 'flex w-2 h-2 bg-rose-500 rounded-full'; text.innerText = t('sync_offline'); }
    }
    window.addEventListener('online', updateConnectionStatus); window.addEventListener('offline', updateConnectionStatus);

    async function processSyncQueue() {
      if (offlineQueue.length === 0 || !navigator.onLine) return;
      const item = offlineQueue[0];
      try { 
        const res = await fetch(`/api/reminders?chat_id=${currentChatId}`, { method: item.method, headers: { 'Content-Type': 'application/json' }, body: item.body ? JSON.stringify(item.body) : null }); 
        if (res.ok) { offlineQueue.shift(); localStorage.setItem('nirvana_sync_queue', JSON.stringify(offlineQueue)); processSyncQueue(); }
        else { offlineQueue.shift(); localStorage.setItem('nirvana_sync_queue', JSON.stringify(offlineQueue)); processSyncQueue(); }
      } catch (e) {}
    }

    async function fetchRemindersFromServer() { 
      try { 
        const res = await fetch(`/api/reminders?chat_id=${currentChatId}`); 
        const data = await res.json(); 
        if (Array.isArray(data)) { 
          const offlineIds = offlineQueue.map(q => q.body && q.body.id);
          const serverData = data.filter(d => !offlineIds.includes(d.id));
          const localUnsynced = currentData.filter(d => offlineIds.includes(d.id));
          currentData = [...serverData, ...localUnsynced];
          renderList(); 
          if (!document.getElementById('calendar-view').classList.contains('hidden')) renderCalendar();
        } 
      } catch (e) { } 
    }

    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js')); }
    setInterval(() => {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const now = new Date().getTime();
      currentData.forEach(r => {
        const target = new Date(r.datetime).getTime();
        if (!r.completed && !r.nativeSent && target <= now && target > now - 60000) {
          new Notification("⏰ Nirvana Reminder", { body: r.isEncrypted ? '🔒 پیام رمزنگاری شده' : r.title }); r.nativeSent = true; localStorage.setItem('nirvana_tasks_cache', JSON.stringify(currentData));
        }
      });
    }, 30000);
  </script>
