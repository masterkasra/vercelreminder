<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یادآور ابری با تلگرام</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- بخش ورود -->
  <div id="login-screen" class="w-full max-w-sm bg-slate-800 p-8 rounded-2xl shadow-xl text-center border border-slate-700">
    <h2 class="text-xl font-bold text-emerald-400 mb-2">ورود به سیستم</h2>
    <p class="text-xs text-slate-400 mb-6">شناسه عددی (Chat ID) تلگرام خود را وارد کنید</p>
    <input id="chat-id-input" type="number" placeholder="مثال: 123456789" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 mb-4 focus:outline-none focus:border-emerald-500 text-slate-100" />
    <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition-colors">ورود امن</button>
  </div>

  <!-- بخش اپلیکیشن (مخفی در ابتدا) -->
  <div id="app-screen" class="w-full max-w-2xl hidden pb-10">
    <header class="flex justify-between items-center mb-8 pt-4 pb-4 border-b border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">یادآور ابری</h1>
        <p class="text-xs text-slate-400 mt-1">متصل به تلگرام و دیتابیس</p>
      </div>
      <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300">خروج</button>
    </header>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8">
      <form onsubmit="addReminder(event)" class="space-y-4">
        <input id="title" type="text" required placeholder="عنوان یادآور" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-emerald-500 text-slate-100" />
        <div class="grid grid-cols-2 gap-4">
          <input id="datetime" type="datetime-local" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 text-slate-100" />
          <select id="priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 text-slate-100">
            <option value="low">عادی</option><option value="medium" selected>متوسط</option><option value="high">فوری</option>
          </select>
        </div>
        <textarea id="desc" rows="2" placeholder="توضیحات..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-emerald-500 text-slate-100"></textarea>
        <button id="submit-btn" type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg">ثبت در دیتابیس</button>
      </form>
    </div>

    <div id="loading" class="text-center text-emerald-500 text-sm hidden">در حال ارتباط با سرور...</div>
    <div id="reminders-list" class="space-y-3"></div>
  </div>

  <script>
    let currentChatId = localStorage.getItem('user_chat_id');

    if (currentChatId) showApp();

    function login() {
      const input = document.getElementById('chat-id-input').value.trim();
      if (!input) return alert('لطفاً Chat ID را وارد کنید');
      currentChatId = input;
      localStorage.setItem('user_chat_id', currentChatId);
      showApp();
    }

    function logout() {
      localStorage.removeItem('user_chat_id');
      window.location.reload();
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      fetchReminders();
    }

    async function apiCall(method, body = null) {
      document.getElementById('loading').classList.remove('hidden');
      const res = await fetch(`/api/reminders?chat_id=${currentChatId}`, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
      document.getElementById('loading').classList.add('hidden');
      return res.json();
    }

    async function fetchReminders() {
      const reminders = await apiCall('GET');
      render(reminders);
    }

    async function addReminder(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'در حال ثبت...';
      
      const payload = {
        title: document.getElementById('title').value,
        datetime: document.getElementById('datetime').value,
        priority: document.getElementById('priority').value,
        desc: document.getElementById('desc').value,
      };

      const res = await apiCall('POST', payload);
      if (res.success) {
        e.target.reset();
        render(res.reminders);
      }
      btn.textContent = 'ثبت در دیتابیس';
    }

    async function toggleComplete(id) {
      const res = await apiCall('POST', { action: 'complete', id });
      if(res.success) render(res.reminders);
    }

    async function deleteReminder(id) {
      if(confirm('یادآور حذف شود؟')) {
        const res = await apiCall('POST', { action: 'delete', id });
        if(res.success) render(res.reminders);
      }
    }

    function render(reminders) {
      const container = document.getElementById('reminders-list');
      container.innerHTML = '';
      if (!reminders || reminders.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-500">خالی است</div>';
        return;
      }
      
      reminders.sort((a, b) => new Date(a.datetime) - new Date(b.datetime)).forEach(r => {
        const d = new Date(r.datetime).toLocaleString('fa-IR', { dateStyle: 'short', timeStyle: 'short' });
        container.innerHTML += `
          <div class="border rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-3 ${r.completed ? 'bg-slate-900 border-slate-800 opacity-50' : 'bg-slate-800 border-slate-700'}">
            <div class="w-full">
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded border border-slate-600">${r.priority === 'high' ? 'فوری' : r.priority === 'medium' ? 'متوسط' : 'عادی'}</span>
                <h3 class="font-medium ${r.completed ? 'line-through' : ''}">${r.title} ${r.sent ? '<span class="text-xs text-blue-400 text-xs mr-2">(ارسال شده به تلگرام)</span>' : ''}</h3>
              </div>
              <div class="text-xs text-slate-400 mt-2">⏰ سررسید: <span dir="ltr">${d}</span></div>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
              <button onclick="toggleComplete(${r.id})" class="px-3 py-1 text-xs rounded border border-slate-600 hover:bg-slate-700 w-full sm:w-auto">${r.completed ? 'بازگردانی' : 'انجام شد'}</button>
              <button onclick="deleteReminder(${r.id})" class="px-3 py-1 text-xs rounded border border-rose-800 text-rose-400 w-full sm:w-auto">حذف</button>
            </div>
          </div>`;
      });
    }
  </script>
</body>
</html>
