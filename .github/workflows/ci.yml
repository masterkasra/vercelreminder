name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: for f in api/*.js lib/*.js sw.js; do node --check "$f"; done

      - name: API, bot, cron and service worker tests
        run: npm test

      - name: Build CSS
        run: npm run build:css
