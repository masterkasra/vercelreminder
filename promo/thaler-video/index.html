<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Thaler Promo</title>
<style>
@font-face { font-family: 'Vazirmatn'; src: url(fonts/Vazirmatn-Variable.ttf) format('truetype'); font-weight: 100 900; }
@font-face { font-family: 'Manrope'; src: url(fonts/Manrope-Variable.woff2) format('woff2'); font-weight: 200 800; }

:root {
  --gold: #F7C548; --gold-2: #E39A2B; --gold-hi: #FFE9A8; --gold-lo: #9A6410;
  --text: #F4F6FB; --muted: #9AA6C4; --line: rgba(255,255,255,.12);
  --card: rgba(255,255,255,.055); --tg: #2AABEE; --bale: #16B67F;
}
html, body { margin: 0; background: #000; }
* { box-sizing: border-box; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  font-family: 'Vazirmatn', 'Noto Color Emoji', sans-serif; color: var(--text);
  background: radial-gradient(120% 70% at 50% 0%, #1B2257 0%, #0B1029 48%, #04060E 100%);
}
#bg, .layer { position: absolute; inset: 0; }
#grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%); }
#fade { position: absolute; inset: 0; background: #000; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* ---------- rays + coin ---------- */
#rays {
  position: absolute; left: 540px; top: 560px; width: 1700px; height: 1700px; margin: -850px 0 0 -850px;
  background: repeating-conic-gradient(from 0deg, rgba(255,214,120,.14) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%);
  mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%);
  opacity: 0;
}
#coinGlow {
  position: absolute; left: 540px; top: 560px; width: 760px; height: 760px; margin: -380px 0 0 -380px;
  border-radius: 50%; background: radial-gradient(circle, rgba(247,197,72,.55) 0%, rgba(247,197,72,.18) 35%, transparent 68%);
  opacity: 0;
}
.shock { position: absolute; left: 540px; top: 560px; width: 300px; height: 300px; margin: -150px 0 0 -150px;
  border-radius: 50%; border: 4px solid var(--gold-hi); opacity: 0; box-shadow: 0 0 40px rgba(247,197,72,.6); }
#coinWrap { position: absolute; left: 540px; top: 560px; width: 300px; height: 300px; margin: -150px 0 0 -150px; perspective: 1100px; }
.coin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
.coin .edge { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(160deg, #D89A2A, #6E4304); }
.coin .face {
  position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; overflow: hidden;
  background: radial-gradient(circle at 34% 28%, #FFF5CF 0%, #F9CF5B 26%, #DDA02A 60%, #99620E 100%);
  box-shadow: inset 0 0 0 9px rgba(255,238,178,.6), inset 0 0 0 15px rgba(125,76,6,.35), inset 0 -22px 44px rgba(90,50,0,.5);
  display: grid; place-items: center;
}
.coin .face.back { transform: rotateY(180deg) translateZ(7px); }
.coin .face.front { transform: translateZ(7px); }
.coin .face::before { content: ''; position: absolute; inset: 24px; border-radius: 50%; border: 4px dotted rgba(122,75,6,.55); }
.coin .glyph { font-weight: 900; font-size: 170px; line-height: 1; color: #B27414; margin-top: -18px;
  text-shadow: 0 3px 0 #FFE8A6, 0 -2px 0 #6F4205, 0 8px 18px rgba(80,45,0,.35); }
.coin .back .glyph { font-family: 'Manrope'; font-size: 150px; margin-top: 0; }
.coin .shine { position: absolute; top: -20%; bottom: -20%; width: 45%; left: -60%;
  background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.85) 50%, transparent 100%); filter: blur(6px); transform: skewX(-18deg); }

/* ---------- persistent brand bug ---------- */
#bug { position: absolute; top: 140px; left: 0; right: 0; height: 64px; display: flex; justify-content: center; align-items: center; gap: 16px; opacity: 0; }
#bug .slot { width: 78px; height: 78px; flex: none; }
#bug .fa { font-size: 52px; font-weight: 900; color: var(--gold); line-height: 1; }
#bug .en { font-family: 'Manrope'; font-weight: 700; font-size: 22px; letter-spacing: .42em; color: var(--muted); margin-top: 8px; }
#footer { position: absolute; bottom: 110px; left: 0; right: 0; text-align: center; font-family: 'Manrope'; font-weight: 600; font-size: 30px; letter-spacing: .12em; color: rgba(255,255,255,.4); opacity: 0; }

/* ---------- shared scene furniture ---------- */
.scene { position: absolute; inset: 0; }
.head { position: absolute; top: 250px; left: 0; right: 0; text-align: center; }
.kicker { display: inline-flex; align-items: center; gap: 12px; padding: 8px 28px 10px; border-radius: 999px;
  border: 2px solid rgba(247,197,72,.45); background: rgba(247,197,72,.08); color: var(--gold); font-size: 30px; font-weight: 700; }
.title { margin: 18px 0 0; font-size: 106px; font-weight: 900; line-height: 1.22;
  background: linear-gradient(180deg, #FFFFFF 35%, #C9D3F0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title .g { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-2)); -webkit-background-clip: text; background-clip: text; }
.sub { margin-top: 6px; font-size: 40px; font-weight: 500; color: var(--muted); }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- scene 1 ---------- */
#s1 .wordmark { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 210px; font-weight: 900; line-height: 1.2;
  background: linear-gradient(180deg, var(--gold-hi) 10%, var(--gold) 50%, var(--gold-2) 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 12px 40px rgba(247,197,72,.25)); }
#s1 .latin { position: absolute; top: 1030px; left: 0; right: 0; text-align: center; font-family: 'Manrope'; font-weight: 700; font-size: 40px; letter-spacing: .55em; padding-left: .55em; color: #D6DEEE; }
#s1 .tagline { position: absolute; top: 1105px; left: 0; right: 0; text-align: center; font-size: 54px; font-weight: 600; color: var(--text); }
#s1 .rule { position: absolute; top: 1200px; left: 390px; width: 300px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

/* ---------- scene 2: website ---------- */
.urlchip { display: inline-flex; align-items: center; gap: 14px; margin-top: 14px; padding: 10px 30px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line);
  font-family: 'Manrope'; font-weight: 700; font-size: 32px; color: #DDE4F6; }
.urlchip .icon { width: 34px; height: 34px; color: var(--gold); }
#s2 .head { top: 240px; }
#s2 .persp { position: absolute; left: 60px; top: 580px; width: 960px; height: 635px; perspective: 1400px; }
.browser { position: absolute; inset: 0; border-radius: 40px; background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
  border: 1px solid rgba(255,255,255,.14); box-shadow: 0 50px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); overflow: hidden; }
.browser .bar { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-bottom: 1px solid var(--line); direction: ltr; }
.browser .dot { width: 18px; height: 18px; border-radius: 50%; }
.browser .addr { margin-left: 22px; flex: 1; height: 44px; border-radius: 22px; background: rgba(0,0,0,.28); display: flex; align-items: center; gap: 10px; padding: 0 22px;
  font-family: 'Manrope'; font-weight: 600; font-size: 24px; color: #C8D1E8; }
.browser .addr .icon { width: 22px; height: 22px; color: #5BD69A; }
.caret { display: inline-block; width: 3px; height: 1em; background: currentColor; margin-left: 2px; vertical-align: -0.12em; }
.grid { position: absolute; top: 72px; left: 0; right: 0; bottom: 0; padding: 26px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 24px; }
.feat { position: relative; border-radius: 30px; background: var(--card); border: 2px solid rgba(255,255,255,.08); padding: 22px 30px; }
.feat .ibox { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; color: #1A1204;
  background: linear-gradient(145deg, var(--gold-hi), var(--gold) 45%, var(--gold-2)); box-shadow: 0 12px 30px rgba(247,197,72,.25); }
.feat .ibox .icon { width: 42px; height: 42px; }
.feat h3 { margin: 12px 0 0; font-size: 42px; font-weight: 800; line-height: 1.3; }
.feat p { margin: 0; font-size: 29px; color: var(--muted); }
.feat .hl { position: absolute; inset: -2px; border-radius: 30px; border: 3px solid var(--gold); box-shadow: 0 0 50px rgba(247,197,72,.35), inset 0 0 40px rgba(247,197,72,.12); opacity: 0; }

/* ---------- scenes 3 and 4: bots ---------- */
.badge { width: 96px; height: 96px; border-radius: 50%; display: inline-grid; place-items: center; vertical-align: middle; }
.badge svg { width: 100%; height: 100%; }
.bothead { display: flex; justify-content: center; align-items: center; gap: 26px; margin-top: 12px; }
.bothead .title { margin: 0; }
.chatpersp { position: absolute; left: 70px; top: 575px; width: 940px; height: 620px; perspective: 1600px; }
.chat { position: absolute; inset: 0; border-radius: 44px; overflow: hidden; border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 50px 120px rgba(0,0,0,.6); backface-visibility: hidden; }
.chat.tg { background: radial-gradient(rgba(255,255,255,.035) 2px, transparent 2.5px) 0 0/34px 34px, linear-gradient(180deg, #13202F, #0D1621); }
.chat.bale { background: radial-gradient(rgba(255,255,255,.035) 2px, transparent 2.5px) 0 0/34px 34px, linear-gradient(180deg, #0F2621, #0A1715); }
.chat .hdr { height: 116px; display: flex; align-items: center; gap: 22px; padding: 0 34px; border-bottom: 1px solid rgba(255,255,255,.08); }
.chat.tg .hdr { background: #17212B; }
.chat.bale .hdr { background: #10302A; }
.mini-coin { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: radial-gradient(circle at 34% 28%, #FFF5CF 0%, #F9CF5B 26%, #DDA02A 60%, #99620E 100%); box-shadow: inset 0 0 0 4px rgba(255,238,178,.6); }
.mini-coin span { font-weight: 900; font-size: 44px; color: #A86C10; margin-top: -6px; }
.chat .who b { display: block; font-size: 38px; font-weight: 800; line-height: 1.25; }
.chat .who small { display: block; font-family: 'Manrope'; font-size: 24px; font-weight: 600; color: var(--muted); direction: ltr; text-align: right; }
.chat .online { margin-inline-start: auto; font-size: 26px; font-weight: 600; padding: 6px 18px; border-radius: 999px; }
.chat.tg .online { color: var(--tg); background: rgba(42,171,238,.12); }
.chat.bale .online { color: var(--bale); background: rgba(22,182,127,.12); }
.msgs { position: absolute; top: 116px; left: 0; right: 0; bottom: 0; padding: 28px 34px; }
.bub { position: absolute; font-size: 34px; line-height: 1.55; padding: 16px 28px; border-radius: 30px; }
.bub.me { top: 30px; left: 34px; font-family: 'Manrope'; font-weight: 700; direction: ltr; border-bottom-left-radius: 8px; }
.chat.tg .bub.me { background: #2B5278; }
.chat.bale .bub.me { background: #1C6B53; font-family: 'Vazirmatn'; }
.bub .tick { font-family: 'Manrope'; font-size: 22px; color: #8FD3FF; margin-left: 12px; }
.chat.bale .bub .tick { color: #9EF0CF; }
.bub.bot { top: 136px; right: 34px; max-width: 700px; background: #1E2C3A; border-bottom-right-radius: 8px; white-space: pre-line; }
.chat.bale .bub.bot { background: #183A32; }
.bub.typing { top: 136px; right: 34px; display: flex; gap: 12px; padding: 26px 30px; background: #1E2C3A; border-bottom-right-radius: 8px; }
.chat.bale .bub.typing { background: #183A32; }
.bub.typing i { width: 16px; height: 16px; border-radius: 50%; background: #9FB2C8; display: block; }
.kbd { position: absolute; top: 324px; right: 34px; width: 700px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kbd .btn { position: relative; overflow: hidden; height: 76px; border-radius: 20px; display: grid; place-items: center; font-size: 31px; font-weight: 700; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); }
.kbd .btn .fill { position: absolute; inset: 0; opacity: 0; }
.chat.tg .kbd .btn .fill { background: var(--tg); }
.chat.bale .kbd .btn .fill { background: var(--bale); }
.kbd .btn span { position: relative; }
.ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.55); opacity: 0; }

/* ---------- scene 5: packages ---------- */
.plans { position: absolute; left: 70px; top: 585px; width: 940px; perspective: 1600px; }
.plan { position: relative; height: 188px; margin-bottom: 22px; border-radius: 36px; background: var(--card); border: 2px solid rgba(255,255,255,.1);
  display: flex; align-items: center; gap: 28px; padding: 0 36px; }
.plan .medal { width: 112px; height: 112px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.plan .medal .icon { width: 52px; height: 52px; }
.plan.bronze .medal { background: radial-gradient(circle at 34% 28%, #FFE1C4, #D48B4E 45%, #8A4A1C); color: #4A2308; }
.plan.silver .medal { background: radial-gradient(circle at 34% 28%, #FFFFFF, #C9D2E3 45%, #7D8AA3); color: #2C3445; }
.plan.gold .medal { background: radial-gradient(circle at 34% 28%, #FFF5CF, #F9CF5B 40%, #A86C10); color: #4A2F04; }
.plan .info h3 { margin: 0; font-size: 54px; font-weight: 900; line-height: 1.3; }
.plan .info p { margin: 0; font-size: 29px; color: var(--muted); }
.plan .price { margin-inline-start: auto; text-align: left; }
.plan .price b { display: block; font-size: 66px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; }
.plan .price small { display: block; font-size: 28px; color: var(--muted); }
.plan.gold .price b { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.plan .ring { position: absolute; inset: -2px; border-radius: 36px; border: 3px solid var(--gold); box-shadow: 0 0 60px rgba(247,197,72,.35), inset 0 0 50px rgba(247,197,72,.1); opacity: 0; }
.plan .shim { position: absolute; inset: 0; border-radius: 36px; overflow: hidden; pointer-events: none; }
.plan .shim i { position: absolute; top: -30%; bottom: -30%; width: 180px; left: -260px; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255,240,200,.28), transparent); }
.plan .ribbon { position: absolute; top: -24px; left: 40px; padding: 4px 24px 8px; border-radius: 999px; font-size: 27px; font-weight: 800; color: #2A1A02;
  background: linear-gradient(135deg, var(--gold-hi), var(--gold) 50%, var(--gold-2)); box-shadow: 0 10px 30px rgba(247,197,72,.4); opacity: 0; }

/* ---------- scene 6: CTA ---------- */
#s6 .title { position: absolute; top: 700px; left: 0; right: 0; text-align: center; margin: 0; font-size: 110px; }
#s6 .sub { position: absolute; top: 850px; left: 0; right: 0; text-align: center; }
.urlbar { position: absolute; left: 110px; top: 935px; width: 860px; height: 132px; border-radius: 66px; display: flex; align-items: center; justify-content: center; gap: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 2px solid rgba(247,197,72,.55);
  box-shadow: 0 0 60px rgba(247,197,72,.2), inset 0 1px 0 rgba(255,255,255,.15); overflow: hidden; direction: ltr; }
.urlbar .icon { width: 56px; height: 56px; color: var(--gold); }
.urlbar .u { font-family: 'Manrope'; font-weight: 800; font-size: 66px; letter-spacing: .01em; color: #fff; min-width: 520px; }
.urlbar .shim { position: absolute; inset: 0; overflow: hidden; }
.urlbar .shim i { position: absolute; top: -40%; bottom: -40%; width: 160px; left: -240px; transform: skewX(-20deg); background: linear-gradient(90deg, transparent, rgba(255,240,200,.35), transparent); }
.pills { position: absolute; left: 110px; top: 1095px; width: 860px; display: flex; gap: 20px; }
.pill { flex: 1; height: 100px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 16px; direction: ltr;
  font-family: 'Manrope'; font-weight: 800; font-size: 34px; border: 2px solid; }
.pill .badge { width: 60px; height: 60px; }
.pill.tg { background: rgba(42,171,238,.14); border-color: rgba(42,171,238,.55); }
.pill.bale { background: rgba(22,182,127,.14); border-color: rgba(22,182,127,.55); }

/* ---------- subtitles ---------- */
#subs { position: absolute; left: 60px; top: 1240px; width: 960px; height: 176px; border-radius: 38px; direction: ltr;
  background: rgba(6,9,24,.58); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 30px 80px rgba(0,0,0,.45); opacity: 0; overflow: hidden; }
.cue { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; opacity: 0; }
.cue .line { white-space: nowrap; font-family: 'Manrope'; display: flex; align-items: center; gap: 16px; }
.cue .tag { font-size: 20px; font-weight: 800; letter-spacing: .08em; padding: 3px 10px; border-radius: 8px; line-height: 1.3; }
.cue .en { font-size: 40px; font-weight: 700; color: #FFFFFF; }
.cue .en .tag { background: var(--gold); color: #2A1A02; }
.cue .de { font-size: 34px; font-weight: 600; color: #C7D0E6; }
.cue .de .tag { background: rgba(255,255,255,.14); color: #E8ECF7; }

/* ---------- light sweep + draft marker ---------- */
#sweep { position: absolute; top: -400px; left: -700px; width: 380px; height: 2800px; transform: rotate(18deg); opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(255,226,150,.28) 40%, rgba(255,255,255,.55) 50%, rgba(255,226,150,.28) 60%, transparent); filter: blur(30px); mix-blend-mode: screen; }
#draft { position: absolute; top: 44px; left: 40px; padding: 8px 20px; border-radius: 12px; background: rgba(255,80,80,.85); color: #fff; font-size: 24px; font-weight: 800; direction: ltr; font-family: 'Manrope', 'Vazirmatn'; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="rays"></div>
  <div id="coinGlow"></div>
  <div class="shock" id="shock1"></div>
  <div class="shock" id="shock2"></div>

  <section class="scene" id="s1">
    <div class="wordmark"></div>
    <div class="latin"></div>
    <div class="tagline"></div>
    <div class="rule"></div>
  </section>

  <section class="scene" id="s2"></section>
  <section class="scene" id="s3"></section>
  <section class="scene" id="s4"></section>
  <section class="scene" id="s5"></section>
  <section class="scene" id="s6"></section>

  <div id="coinWrap"><div class="coin"></div></div>
  <div id="bug"><i class="slot"></i><span class="fa"></span><span class="en"></span></div>
  <div id="footer"></div>
  <div id="subs"></div>
  <div id="sweep"></div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="content.js"></script>
<script>
(() => {

const W = 1080, H = 1920, FPS = 30, DURATION = 30;

const faNum = n => new Intl.NumberFormat('fa-IR').format(n);

// Lucide icons (ISC). pathLength=1 lets every stroke "draw on" with a 0→1 dash offset.
const ICONS = {
  'user-plus': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
  'layout-dashboard': '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',

  'headphones': '<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',
  'shopping-cart': '<path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/>',

// ---------------------------------------------------------------- background (drawn per frame)
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20250927);
const dust = Array.from({ length: 110 }, () => ({ x: R() * W, y: R() * H, r: .8 + R() * 2.6, v: 8 + R() * 38, ph: R() * 6.28, f: .6 + R() * 1.8, gold: R() < .55 }));
const burst = Array.from({ length: 90 }, () => { const a = R() * Math.PI * 2, s = 380 + R() * 900; return { vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.5 + R() * 4, life: .9 + R() * 1.2 }; });
// Scene palettes for the three drifting light blobs: [time, colourA, colourB, colourC]
const PAL = [
  [0, [247, 197, 72], [72, 64, 210], [30, 150, 210]],
  [4, [120, 90, 255], [247, 197, 72], [40, 120, 220]],
  [10, [42, 171, 238], [60, 80, 220], [247, 197, 72]],
  [14, [22, 182, 127], [30, 120, 150], [247, 197, 72]],
  [18, [247, 197, 72], [227, 120, 40], [90, 70, 220]],
  [24, [247, 197, 72], [80, 70, 230], [255, 150, 60]],
];
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
function palette(t) {
  let i = 0; while (i < PAL.length - 1 && t >= PAL[i + 1][0]) i++;
  const cur = PAL[i], prev = PAL[Math.max(0, i - 1)];
  const k = i === 0 ? 1 : smooth(t - cur[0]);
  return [1, 2, 3].map(j => cur[j].map((v, c) => Math.round(prev[j][c] + (v - prev[j][c]) * k)));
}
const ctx = $('#bg').getContext('2d');
function drawBg(t) {
  ctx.clearRect(0, 0, W, H);
  const [a, b, c] = palette(t);
  ctx.globalCompositeOperation = 'lighter';
  const blobs = [
    [540 + 320 * Math.sin(t * .23), 520 + 180 * Math.cos(t * .31), 820, a, .30],
    [300 + 260 * Math.cos(t * .19 + 1), 1250 + 220 * Math.sin(t * .27), 760, b, .26],
    [820 + 200 * Math.sin(t * .29 + 2), 1600 + 160 * Math.cos(t * .21), 700, c, .20],
  ];
  for (const [x, y, r, col, al] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${al})`); g.addColorStop(.45, `rgba(${col},${al * .35})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const p of dust) {
    const y = ((p.y - p.v * t) % H + H) % H, x = p.x + 14 * Math.sin(t * .5 + p.ph);
    const al = .18 + .32 * (.5 + .5 * Math.sin(t * p.f + p.ph));
    ctx.fillStyle = p.gold ? `rgba(255,214,120,${al})` : `rgba(210,225,255,${al * .8})`;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();
  }
  const bt = t - 24.0; // spark burst when the coin lands in the call to action
  if (bt > 0 && bt < 2.2) {
    for (const p of burst) {
      if (bt > p.life) continue;
      const k = 1 - Math.exp(-bt * 2.6), x = 540 + p.vx * k / 2.6, y = 470 + p.vy * k / 2.6 + 90 * bt * bt;
      const al = (1 - bt / p.life) * .9;
      ctx.fillStyle = `rgba(255,${200 + (p.r * 10 | 0)},120,${al})`;
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}
// Static film grain keeps dark gradients from banding after H.264 compression.
(() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gc = g.getContext('2d'), img = gc.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gc.putImageData(img, 0, 0);
  $('#grain').style.background = `url(${g.toDataURL()})`;
})();

// ---------------------------------------------------------------- timeline
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
const at = (fn, time) => fn(time);

function titleIn(el, t0, d = .8) {
  tl.fromTo(el, { clipPath: 'inset(-30% 0% -30% 100%)', y: 36, filter: 'blur(14px)', opacity: 0 },
    { clipPath: 'inset(-30% 0% -30% 0%)', y: 0, filter: 'blur(0px)', opacity: 1, duration: d, ease: 'expo.out' }, t0);
}
function rise(el, t0, o = {}) {
  tl.fromTo(el, { y: o.y ?? 40, opacity: 0, filter: 'blur(8px)', scale: o.s ?? 1 },
    { y: 0, opacity: 1, filter: 'blur(0px)', scale: 1, duration: o.d ?? .6, ease: o.ease ?? 'power3.out', stagger: o.stagger ?? 0 }, t0);
}
function leave(el, t0, o = {}) {
  tl.to(el, { x: o.x ?? -150, y: o.y ?? 0, scale: o.s ?? .97, opacity: 0, filter: 'blur(12px)', duration: o.d ?? .42, ease: 'power2.in' }, t0);
}
function drift(el, t0, t1) { tl.fromTo(el, { scale: 1 }, { scale: 1.035, duration: t1 - t0, ease: 'none', immediateRender: false }, t0); }
function sweep(t0) { tl.fromTo('#sweep', { x: 0, opacity: 0 }, { keyframes: [{ opacity: 1, duration: .12 }, { opacity: 0, duration: .38 }], x: 2100, duration: .5, ease: 'power1.inOut', immediateRender: false }, t0); }
function drawIcons(root, t0, stagger = .12) {
  $$('.ibox, .medal', root).forEach((box, i) =>
    tl.fromTo($$('[pathLength]', box), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: .9, ease: 'power2.inOut' }, t0 + i * stagger));
}
function shock(t0) {
  tl.fromTo('#shock1', { scale: .9, opacity: .95 }, { scale: 2.6, opacity: 0, duration: 1, ease: 'expo.out', immediateRender: false }, t0);
  tl.fromTo('#shock2', { scale: .9, opacity: .6 }, { scale: 3.4, opacity: 0, duration: 1.3, ease: 'expo.out', immediateRender: false }, t0 + .1);
}

// Scenes 3 and 4 — bots (10–18 s)
function botScene(sel, t0, tapIndex, enterFlip) {
  const s = $(sel);
  rise($('.kicker', s), t0 + .05, { y: 24 });
  tl.fromTo($('.badge', s), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: .7, ease: 'back.out(2.2)' }, t0 + .1);
  titleIn($('.title', s), t0 + .15);
  rise($('.sub', s), t0 + .35, { y: 24 });
  const chatEl = $('.chat', s);
  if (enterFlip) tl.fromTo(chatEl, { rotationY: 90, opacity: 0 }, { rotationY: 0, opacity: 1, duration: .5, ease: 'power2.out' }, t0 + .15);
  else tl.fromTo(chatEl, { x: 380, rotationY: -28, opacity: 0 }, { x: 0, rotationY: 0, opacity: 1, duration: 1, ease: 'expo.out' }, t0 + .1);
  tl.fromTo($('.bub.me', s), { scale: .4, opacity: 0, transformOrigin: '0% 100%' }, { scale: 1, opacity: 1, duration: .45, ease: 'back.out(2)' }, t0 + .7);
  tl.fromTo($('.bub.typing', s), { scale: .5, opacity: 0, transformOrigin: '100% 100%' }, { scale: 1, opacity: 1, duration: .3, ease: 'back.out(2)' }, t0 + 1.0)
    .to($('.bub.typing', s), { opacity: 0, scale: .8, duration: .15 }, t0 + 1.45);
  tl.fromTo($('.bub.bot', s), { scale: .4, opacity: 0, transformOrigin: '100% 100%' }, { scale: 1, opacity: 1, duration: .55, ease: 'back.out(1.6)' }, t0 + 1.5);
  tl.fromTo($$('.kbd .btn', s), { y: 26, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: .45, stagger: .08, ease: 'back.out(1.8)' }, t0 + 1.8);
  const btn = $$('.kbd .btn', s)[tapIndex], rip = $('.ripple', s), msgs = $('.msgs', s);
  const br = { x: btn.offsetLeft + $('.kbd', s).offsetLeft + btn.offsetWidth / 2, y: btn.offsetTop + $('.kbd', s).offsetTop + btn.offsetHeight / 2 };
  gsap.set(rip, { left: br.x, top: br.y });
  tl.fromTo(rip, { scale: .2, opacity: .7 }, { scale: 2.6, opacity: 0, duration: .6, ease: 'power2.out', immediateRender: false }, t0 + 2.75);
  tl.fromTo($('.fill', btn), { opacity: 0 }, { keyframes: [{ opacity: .9, duration: .12 }, { opacity: .35, duration: .6 }], immediateRender: false }, t0 + 2.75);
  tl.fromTo(btn, { scale: 1 }, { keyframes: [{ scale: .93, duration: .1 }, { scale: 1, duration: .35, ease: 'back.out(3)' }], immediateRender: false }, t0 + 2.75);
  return { s, chatEl };
}
const tg = botScene('#s3', 10, 0, false);
drift('#s3 .head', 10, 14);
tl.to($('.head', tg.s), { y: -50, opacity: 0, filter: 'blur(10px)', duration: .35, ease: 'power2.in' }, 13.8);
tl.to(tg.chatEl, { rotationY: -90, duration: .32, ease: 'power2.in' }, 13.85);
const bale = botScene('#s4', 14.02, 1, true);
drift('#s4 .head', 14, 18);
leave('#s4', 17.7);
sweep(17.75);

// Scene 5 — packages (18–24 s)
rise('#s5 .kicker', 18.05, { y: 24 });
titleIn('#s5 .title', 18.12);
rise('#s5 .sub', 18.35, { y: 24 });
$$('#s5 .plan').forEach((p, i) => {
  const t0 = 18.45 + i * .2, dir = i % 2 ? -1 : 1;
  tl.fromTo(p, { x: 320 * dir, rotationY: 22 * dir, opacity: 0, filter: 'blur(10px)' }, { x: 0, rotationY: 0, opacity: 1, filter: 'blur(0px)', duration: .85, ease: 'expo.out' }, t0);
  tl.fromTo($('.medal', p), { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: .7, ease: 'back.out(2)' }, t0 + .12);
});
drawIcons($('#s5'), 18.6, .2);
const feat = $('#s5 .plan.featured');
if (feat) {
  const others = $$('#s5 .plan:not(.featured)');
  tl.to(feat, { scale: 1.045, duration: .5, ease: 'back.out(2)' }, 21.0);
  tl.to(others, { opacity: .5, scale: .98, duration: .5 }, 21.0);
  tl.fromTo($('.ring', feat), { opacity: 0 }, { opacity: 1, duration: .4, immediateRender: false }, 21.0);
  tl.fromTo($('.ribbon', feat), { scale: 0, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: .6, ease: 'back.out(3)' }, 21.15);
  tl.fromTo($('.shim i', feat), { x: 0 }, { x: 1400, duration: .9, ease: 'power2.inOut', immediateRender: false }, 21.2);
  tl.fromTo($('.shim i', feat), { x: 0 }, { x: 1400, duration: .9, ease: 'power2.inOut', immediateRender: false }, 22.7);
}
leave('#s5', 23.45, { x: 0, s: .92, d: .45 });

// Scene 6 — call to action (24–30 s); the coin lands on the 24 s downbeat
tl.to('#bug, #footer', { opacity: 0, y: -12, duration: .3, ease: 'power2.in' }, 23.45);
tl.to('#coinWrap', { x: 0, y: -90, scale: .9, duration: .65, ease: 'power3.inOut' }, 23.35);
tl.to('.coin', { rotationY: 360 + 720, duration: .8, ease: 'power3.inOut' }, 23.3);
tl.set('#rays, #coinGlow, .shock', { top: 470 }, 23.7);
tl.fromTo('#coinGlow', { opacity: 0, scale: .4 }, { opacity: 1, scale: 1, duration: .8, immediateRender: false }, 23.95);
tl.fromTo('#rays', { opacity: 0, scale: .6 }, { opacity: .9, scale: 1, duration: 1.1, immediateRender: false }, 23.95);
shock(24.0);
titleIn('#s6 .title', 24.2, .9);
rise('#s6 .sub', 24.45, { y: 24 });
tl.fromTo('#s6 .urlbar', { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .7, ease: 'back.out(1.8)' }, 24.65);
tl.fromTo('#s6 .pill', { y: 40, opacity: 0, scale: .85 }, { y: 0, opacity: 1, scale: 1, duration: .6, stagger: .15, ease: 'back.out(2)' }, 25.35);
tl.fromTo('#s6 .urlbar .shim i', { x: 0 }, { x: 1300, duration: 1, ease: 'power2.inOut', immediateRender: false }, 26.4);
tl.fromTo('#s6 .urlbar .shim i', { x: 0 }, { x: 1300, duration: 1, ease: 'power2.inOut', immediateRender: false }, 28.2);
tl.fromTo('.coin .shine', { x: 0 }, { x: 560, duration: .8, ease: 'power2.inOut', immediateRender: false }, 27.2);
tl.fromTo('#s6 .pill', { scale: 1 }, { keyframes: [{ scale: 1.06, duration: .25 }, { scale: 1, duration: .4 }], stagger: .2, immediateRender: false }, 27.6);
tl.to('.coin', { rotationY: 360 + 720 + 360, duration: 1.6, ease: 'power2.inOut' }, 28.0);
tl.set({}, {}, DURATION);

// Subtitles box + cues
rise('#subs', .5, { y: 30, d: .6 });
$$('#subs .cue').forEach((el, i) => {
  const [s, e] = C.subtitles[i];
  tl.fromTo(el, { opacity: 0, y: 16, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .3, ease: 'power2.out' }, s);
  if (e < DURATION - .05) tl.to(el, { opacity: 0, y: -12, filter: 'blur(6px)', duration: .2, ease: 'power2.in' }, e - .2);
});

// ---------------------------------------------------------------- per-frame extras GSAP doesn't cover
const typed = $$('.typed').map(el => ({ el, text: el.dataset.text, at: +el.dataset.at, dur: +el.dataset.dur, caret: el.parentElement.querySelector('.caret') }));
const prices = $$('#s5 [data-price]').map((el, i) => ({ el, v: +el.dataset.price, at: 18.75 + i * .2 }));
const typingDots = [...$$('#s3 .bub.typing i'), ...$$('#s4 .bub.typing i')];
function extras(t) {
  for (const k of typed) {
    const p = Math.max(0, Math.min(1, (t - k.at) / k.dur));
    k.el.textContent = k.text.slice(0, Math.round(p * k.text.length));
    k.caret.style.opacity = (p > 0 && p < 1) || Math.floor(t * 2.2) % 2 === 0 ? 1 : 0;
  }
  for (const p of prices) {
    const k = Math.max(0, Math.min(1, (t - p.at) / 1.1)), e = 1 - Math.pow(1 - k, 3);
    p.el.textContent = faNum(Math.round(p.v * e / 1000) * 1000);
  }
  typingDots.forEach((d, i) => { d.style.transform = `translateY(${-10 * Math.max(0, Math.sin(t * 9 - (i % 3) * .9))}px)`; });
  $('#rays').style.rotate = `${t * 7}deg`;
  // gentle idle float of the coin on the final card
  const f = Math.max(0, Math.min(1, (t - 25) / 1));
  $('.coin').style.translate = `0 ${f * 10 * Math.sin((t - 25) * 2.2)}px`;
}

// Fit each subtitle line to the box width.
function fitSubs() {
  for (const line of $$('#subs .line')) {
    let fs = parseFloat(getComputedStyle(line).fontSize);
    while (line.scrollWidth > 900 && fs > 22) { fs -= 1; line.style.fontSize = fs + 'px'; }
  }
}

window.__seek = t => { tl.seek(t, false); drawBg(t); extras(t); };
window.__meta = { fps: FPS, duration: DURATION, width: W, height: H };
Promise.all([document.fonts.load('900 100px Vazirmatn'), document.fonts.load('500 40px Vazirmatn'), document.fonts.load('700 40px Manrope')])
  .then(() => document.fonts.ready)
  .then(() => { fitSubs(); window.__seek(0); window.__ready = true; });

// Live preview when opened in a normal browser (?t=12 jumps to a time, ?loop plays it).
const q = new URLSearchParams(location.search);
if (q.has('play') || q.has('t')) {
  const start = +(q.get('t') || 0);
  const t0 = performance.now();
  const tick = () => { if (!window.__ready) return requestAnimationFrame(tick); const t = q.has('play') ? (start + (performance.now() - t0) / 1000) % DURATION : start; window.__seek(t); if (q.has('play')) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
})();
</script>
