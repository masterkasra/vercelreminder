<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Thaler Guide</title>
<style>
@font-face { font-family: 'Vazirmatn'; src: url(fonts/Vazirmatn-Variable.ttf) format('truetype'); font-weight: 100 900; }
@font-face { font-family: 'Manrope'; src: url(fonts/Manrope-Variable.woff2) format('woff2'); font-weight: 200 800; }

:root {
  --gold: #F7C548; --gold-2: #E39A2B; --gold-hi: #FFE9A8;
  --v1: #8B7CF6; --v2: #B48CFF; --vgrad: linear-gradient(90deg, #8FA0FF 0%, #A98BFF 45%, #E68BE8 100%);
  --text: #F4F4FA; --muted: #A09EB8; --line: rgba(255,255,255,.12); --card: #15141E;
  --tg: #2AABEE; --bale: #16B67F; --green: #34D399; --red: #FF6B8B; --cyan: #22D3EE;
  --der: #4EA3FF; --die: #FF6FAE; --das: #34D399;
}
html, body { margin: 0; background: #000; }
* { box-sizing: border-box; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Vazirmatn', 'Noto Color Emoji', sans-serif; color: var(--text);
  background: radial-gradient(120% 70% at 50% 0%, #1C1738 0%, #0B0A17 48%, #040409 100%); }
#bg { position: absolute; inset: 0; }
#grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%); }
#fade { position: absolute; inset: 0; background: #000; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.g { background: var(--vgrad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.art { font-family: 'Manrope'; font-weight: 800; font-size: 26px; padding: 3px 14px 5px; border-radius: 10px; color: #0B0A17; line-height: 1.3; }
.art.der { background: var(--der); } .art.die { background: var(--die); } .art.das { background: var(--das); }
.caret { display: inline-block; width: 3px; height: 1em; background: currentColor; margin-left: 2px; vertical-align: -0.12em; }

/* ---------- rays + coin (shared with the promo) ---------- */
#rays { position: absolute; left: 540px; top: 500px; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(200,170,255,.13) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%); mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%); }
#coinGlow { position: absolute; left: 540px; top: 500px; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle, rgba(247,197,72,.5) 0%, rgba(160,120,255,.22) 35%, transparent 68%); }
.shock { position: absolute; left: 540px; top: 500px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 4px solid var(--gold-hi); opacity: 0; box-shadow: 0 0 40px rgba(247,197,72,.6); }
#coinWrap { position: absolute; left: 540px; top: 500px; width: 300px; height: 300px; margin: -150px 0 0 -150px; perspective: 1100px; }
.coin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
.coin .edge { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(160deg, #D89A2A, #6E4304); }
.coin .face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 28%, #FFF5CF 0%, #F9CF5B 26%, #DDA02A 60%, #99620E 100%);
  box-shadow: inset 0 0 0 9px rgba(255,238,178,.6), inset 0 0 0 15px rgba(125,76,6,.35), inset 0 -22px 44px rgba(90,50,0,.5); }
.coin .face.front { transform: translateZ(7px); }
.coin .face.back { transform: rotateY(180deg) translateZ(7px); }
.coin .face::before { content: ''; position: absolute; inset: 24px; border-radius: 50%; border: 4px dotted rgba(122,75,6,.55); }
.coin .glyph { font-weight: 900; font-size: 170px; line-height: 1; color: #B27414; margin-top: -18px; text-shadow: 0 3px 0 #FFE8A6, 0 -2px 0 #6F4205, 0 8px 18px rgba(80,45,0,.35); }
.coin .front .glyph { font-family: 'Manrope'; font-weight: 800; font-size: 118px; letter-spacing: -.03em; margin-top: 0; }
.coin .shine { position: absolute; top: -20%; bottom: -20%; width: 45%; left: -60%; background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.85) 50%, transparent 100%); filter: blur(6px); transform: skewX(-18deg); }

/* ---------- brand bar, progress, step heads ---------- */
#bug { position: absolute; top: 104px; left: 0; right: 0; height: 64px; display: flex; justify-content: center; align-items: center; gap: 16px; opacity: 0; }
#bug .slot { width: 78px; height: 78px; flex: none; }
#bug .fa { font-size: 52px; font-weight: 900; line-height: 1; }
#bug .en { font-family: 'Manrope'; font-weight: 700; font-size: 22px; letter-spacing: .42em; color: var(--muted); margin-top: 8px; }
#footer { position: absolute; bottom: 110px; left: 0; right: 0; text-align: center; font-family: 'Manrope'; font-weight: 600; font-size: 30px; letter-spacing: .12em; color: rgba(255,255,255,.4); opacity: 0; }
#progress { position: absolute; top: 198px; left: 90px; width: 900px; display: flex; gap: 8px; opacity: 0; }
#progress .seg { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
#progress .seg i { display: block; height: 100%; background: var(--vgrad); transform-origin: right center; }
.shead { position: absolute; top: 226px; left: 0; right: 0; text-align: center; }
.kicker { display: inline-flex; align-items: center; padding: 6px 24px 8px; border-radius: 999px; border: 2px solid rgba(139,124,246,.5); background: rgba(139,124,246,.1); color: #C3B8FF; font-size: 28px; font-weight: 700; }
.title { margin: 8px 0 0; font-size: 86px; font-weight: 900; line-height: 1.22; white-space: nowrap;
  background: linear-gradient(180deg, #FFFFFF 35%, #D2CDEB 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title .g { background: var(--vgrad); -webkit-background-clip: text; background-clip: text; }
.path { display: inline-flex; align-items: center; gap: 12px; margin-top: 8px; padding: 6px 24px 8px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 28px; color: #CFCDE2; white-space: nowrap; }
.path .sep { color: var(--v2); font-weight: 800; }
.path b { color: #fff; font-weight: 800; }

/* ---------- intro / outro ---------- */
#s0 .title { position: absolute; top: 676px; left: 0; right: 0; text-align: center; margin: 0; font-size: 124px; }
#s0 .sub { position: absolute; top: 850px; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 600; color: #DCD8F2; }
#s0 .latin { position: absolute; top: 940px; left: 0; right: 0; text-align: center; font-family: 'Manrope'; font-weight: 700; font-size: 34px; letter-spacing: .5em; padding-left: .5em; color: var(--muted); }
#s10 .title { position: absolute; top: 650px; left: 0; right: 0; text-align: center; margin: 0; font-size: 100px; }
#s10 .sub { position: absolute; top: 790px; left: 0; right: 0; text-align: center; font-size: 34px; color: var(--muted); white-space: nowrap; }
.urlbar { position: absolute; left: 110px; top: 880px; width: 860px; height: 128px; border-radius: 64px; display: flex; align-items: center; justify-content: center; gap: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 2px solid rgba(170,140,255,.6); box-shadow: 0 0 60px rgba(150,120,255,.25); overflow: hidden; direction: ltr; }
.urlbar .icon { width: 54px; height: 54px; color: var(--v2); }
.urlbar .u { font-family: 'Manrope'; font-weight: 800; font-size: 64px; color: #fff; min-width: 510px; }
.shim { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.shim i { position: absolute; top: -40%; bottom: -40%; width: 160px; left: -240px; transform: skewX(-20deg); background: linear-gradient(90deg, transparent, rgba(225,210,255,.32), transparent); }
.pills { position: absolute; left: 110px; top: 1036px; width: 860px; display: flex; gap: 20px; }
.pill { flex: 1; height: 100px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 16px; direction: ltr; font-family: 'Manrope'; font-weight: 800; font-size: 34px; border: 2px solid; }
.pill .badge, .mp .badge { width: 60px; height: 60px; display: inline-grid; flex: none; }
.badge svg { width: 100%; height: 100%; }
.pill.tg { background: rgba(42,171,238,.14); border-color: rgba(42,171,238,.55); }
.pill.bale { background: rgba(22,182,127,.14); border-color: rgba(22,182,127,.55); }

/* ---------- the app frame ---------- */
.frame { position: absolute; left: 70px; top: 490px; width: 940px; height: 730px; border-radius: 40px; overflow: hidden; background: #0D0C14;
  border: 1px solid rgba(255,255,255,.13); box-shadow: 0 50px 120px rgba(0,0,0,.6); opacity: 0; }
.fhdr { position: relative; height: 76px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.08); background: #121119; z-index: 3; }
.ham { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.06); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
.ham i { display: block; width: 24px; height: 3px; border-radius: 2px; background: #DAD8EA; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 32px; font-weight: 900; }
.logo .de { font-family: 'Manrope'; font-size: 18px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: #22203A; color: #C3B8FF; }
.bellb { margin-inline-start: auto; width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.06); display: grid; place-items: center; font-size: 24px; }
.content { position: absolute; top: 76px; left: 0; right: 0; bottom: 0; }
.screen { position: absolute; inset: 0; padding: 24px 26px; }
.overlay { position: absolute; top: 76px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); z-index: 2; }
.drawer { position: absolute; top: 76px; right: 0; bottom: 0; width: 430px; background: #16151F; border-left: 1px solid rgba(255,255,255,.1); padding: 14px 14px; box-shadow: -30px 0 60px rgba(0,0,0,.5); z-index: 2; }
.mi { position: relative; height: 54px; margin-bottom: 4px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-radius: 14px; font-size: 28px; font-weight: 600; color: #D9D7E8; }
.mi .em { width: 36px; text-align: center; font-size: 26px; position: relative; }
.mi span:last-child { position: relative; }
.mi .hl { position: absolute; inset: 0; border-radius: 14px; background: rgba(139,124,246,.28); border: 2px solid rgba(170,150,255,.7); }

#cursor { position: absolute; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; opacity: 0; }
#cursor .dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 8px 22px rgba(0,0,0,.55), inset 0 0 0 5px rgba(139,124,246,.65); }
#cursor .ring { position: absolute; inset: -8px; border-radius: 50%; border: 3px solid #fff; opacity: 0; }

/* shared bits inside screens */
.card { border-radius: 26px; background: var(--card); border: 1px solid rgba(255,255,255,.09); }
.btn-p { display: inline-flex; align-items: center; padding: 14px 28px; border-radius: 18px; background: linear-gradient(135deg, #9D8CFF, #7A63F0); font-size: 27px; font-weight: 800; color: #fff; box-shadow: 0 14px 40px rgba(139,124,246,.4); white-space: nowrap; position: relative; overflow: hidden; }
.btn-g { display: inline-flex; align-items: center; padding: 14px 28px; border-radius: 18px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); font-size: 27px; font-weight: 800; white-space: nowrap; position: relative; overflow: hidden; }
.flash { position: absolute; inset: 0; background: rgba(255,255,255,.35); opacity: 0; }
.chips { display: flex; gap: 10px; justify-content: center; }
.chip2 { padding: 7px 18px 9px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 23px; font-weight: 700; white-space: nowrap; color: #D6D4E8; }
.chip2.on { background: rgba(139,124,246,.22); border-color: rgba(170,150,255,.6); color: #fff; }

/* step 1: landing + placement test */
.land { text-align: center; padding-top: 48px; }
.land .tp { display: inline-block; font-size: 22px; padding: 6px 18px; border-radius: 999px; background: rgba(139,124,246,.12); border: 1px solid rgba(139,124,246,.4); color: #C3B8FF; }
.land h4 { margin: 30px 0 0; font-size: 62px; font-weight: 900; line-height: 1.38; }
.land h4 span { display: block; }
.land h4 .g { display: table; margin: 0 auto; }
.land .btns { display: flex; justify-content: center; gap: 18px; margin-top: 40px; }
.land small { display: block; margin-top: 28px; font-size: 22px; color: var(--muted); }
.lv { text-align: center; padding-top: 44px; }
.lv h5 { margin: 0; font-size: 46px; font-weight: 900; }
.gauge { position: relative; margin: 92px auto 0; width: 800px; display: flex; justify-content: space-between; direction: ltr; }
.lvl { position: relative; width: 136px; height: 116px; border-radius: 26px; display: grid; place-items: center; font-family: 'Manrope'; font-weight: 800; font-size: 46px;
  background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.1); color: #8E8CA6; overflow: hidden; }
.lvl .on { position: absolute; inset: 0; background: linear-gradient(145deg, #9D8CFF, #7A63F0 55%, #D17FE6); opacity: 0; }
.lvl b { position: relative; }
.mark { position: absolute; top: -58px; left: 0; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 28px solid var(--gold); margin-left: -20px; filter: drop-shadow(0 6px 12px rgba(247,197,72,.5)); }
.res { display: inline-flex; align-items: center; gap: 18px; margin-top: 64px; padding: 16px 36px; border-radius: 26px; font-size: 36px; font-weight: 800;
  background: linear-gradient(135deg, rgba(157,140,255,.25), rgba(209,127,230,.2)); border: 2px solid rgba(180,150,255,.55); }
.res b { font-family: 'Manrope'; font-size: 56px; }
.lv .note { margin-top: 18px; font-size: 28px; color: var(--muted); }

/* step 2: dashboard */
.dash .card { padding: 20px 24px; margin-bottom: 14px; }
.rv { display: flex; align-items: center; gap: 20px; }
.rv .tx { flex: 1; min-width: 0; }
.rv h6, .td h6, .ms h6 { margin: 0; font-size: 34px; font-weight: 900; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.vip { font-size: 20px; font-weight: 800; padding: 3px 12px 5px; border-radius: 10px; color: #3A2A02; background: linear-gradient(135deg, var(--gold-hi), var(--gold)); }
.rv p { margin: 6px 0 0; font-size: 24px; color: var(--muted); white-space: nowrap; }
.td .row { position: relative; height: 60px; margin-top: 12px; border-radius: 16px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); font-size: 25px; white-space: nowrap; }
.td .row:first-of-type { border-color: rgba(247,197,72,.45); }
.td .ck { margin-inline-start: auto; width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; position: relative; }
.td .ck i { position: absolute; inset: -2px; border-radius: 50%; background: var(--green); display: grid; place-items: center; color: #062; font-style: normal; font-weight: 900; font-size: 20px; opacity: 0; }
.ms h6 .cnt { margin-inline-start: auto; font-family: 'Vazirmatn'; font-size: 24px; font-weight: 800; padding: 2px 14px 4px; border-radius: 10px; background: rgba(255,255,255,.08); }
.ms .bar { margin-top: 14px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
.ms .bar i { display: block; height: 100%; width: 100%; background: var(--vgrad); transform-origin: right center; }

/* step 3: flashcard + word bank */
.p3 { perspective: 1400px; height: 330px; }
.fc3 { position: relative; margin: 6px auto 0; width: 290px; height: 320px; transform-style: preserve-3d; }
.fc3 .face { position: absolute; inset: 0; border-radius: 32px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: linear-gradient(170deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
.fc3 .face b { font-family: 'Manrope'; font-weight: 800; font-size: 50px; direction: ltr; }
.fc3 .face.back { transform: rotateY(180deg); background: linear-gradient(160deg, #8C7CF7, #D98BEE); }
.fc3 .face.back b { font-family: 'Vazirmatn'; font-weight: 900; font-size: 64px; }
.fc3 .face.back small { font-size: 22px; font-weight: 700; padding: 5px 14px 7px; border-radius: 10px; background: rgba(20,10,40,.28); }
.sbox { position: relative; margin: 30px auto 0; width: 840px; height: 84px; border-radius: 22px; background: var(--card); border: 2px solid rgba(160,140,255,.5); display: flex; align-items: center; gap: 16px; padding: 0 26px; font-size: 30px; }
.sbox .q { font-family: 'Manrope'; font-weight: 700; direction: ltr; }
.sbox .ph { position: absolute; right: 78px; color: #77758E; }
.sres { margin: 16px auto 0; width: 840px; height: 106px; border-radius: 22px; background: rgba(255,255,255,.05); border: 1px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 0 26px; }
.sres b { font-family: 'Manrope'; font-weight: 800; font-size: 46px; direction: ltr; }
.sres .m { margin-inline-start: auto; font-size: 32px; font-weight: 700; color: #DCD8F2; }

/* step 4: speaking */
.mic-w { height: 228px; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 34px; }
.wave { display: flex; align-items: center; gap: 9px; height: 150px; }
.wave i { display: block; width: 10px; height: 20px; border-radius: 5px; background: var(--vgrad); }
.mic { position: relative; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, #9D8CFF, #7A63F0 55%, #D17FE6); box-shadow: 0 20px 50px rgba(139,124,246,.5); }
.mic .icon { width: 64px; height: 64px; }
.mic .pulse { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(190,170,255,.7); opacity: 0; }
.bub { border-radius: 26px; padding: 16px 24px; font-size: 30px; }
.bub.me { display: table; direction: ltr; margin: 4px auto 0 0; font-family: 'Manrope'; font-weight: 700; background: #23324A; }
.bub.me .bad { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 4px; color: #FFB3C2; }
.bub.ai { margin-top: 16px; background: #1C1A2B; border: 1px solid rgba(160,140,255,.4); }
.bub.ai .fx { direction: ltr; text-align: left; font-family: 'Manrope'; font-weight: 700; font-size: 32px; }
.bub.ai .good { color: #5EE3A8; font-weight: 800; }
.bub.ai .nt { margin-top: 8px; font-size: 25px; color: var(--muted); }

/* step 5: listening */
.player { margin-top: 16px; height: 186px; display: flex; align-items: center; gap: 24px; padding: 0 24px; }
.cover { width: 136px; height: 136px; border-radius: 24px; flex: none; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #F28AC9, #8C7CF7); }
.cover .icon { width: 60px; height: 60px; }
.player .tx { flex: 1; min-width: 0; }
.player b { display: block; font-family: 'Manrope'; font-weight: 800; font-size: 34px; direction: ltr; text-align: right; }
.player small { display: block; font-size: 23px; color: var(--muted); }
.pbar { margin-top: 16px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; direction: ltr; }
.pbar i { display: block; height: 100%; width: 0; background: var(--vgrad); }
.play { width: 92px; height: 92px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #1A1530; font-size: 36px; font-family: 'Manrope'; font-weight: 800; position: relative; }
.play span { position: absolute; }
.lyr { position: relative; margin-top: 16px; padding: 14px 18px; }
.lyr .hlb { position: absolute; left: 12px; right: 12px; top: 0; height: 0; border-radius: 18px; background: rgba(139,124,246,.2); border: 1px solid rgba(170,150,255,.45); opacity: 0; }
.ln { position: relative; padding: 10px 14px; }
.ln .de { direction: ltr; text-align: left; font-family: 'Manrope'; font-weight: 700; font-size: 30px; color: #7F7D97; }
.ln .fa { font-size: 23px; color: #6E6C86; margin-top: 2px; }
.ln.on .de { color: #fff; } .ln.on .fa { color: #CFCBE6; }

/* step 6: writing */
.ed { margin-top: 16px; padding: 20px 26px; height: 176px; }
.ed .lb { font-size: 23px; color: var(--muted); }
.ed .txt { margin-top: 18px; direction: ltr; text-align: left; font-family: 'Manrope'; font-weight: 700; font-size: 42px; white-space: nowrap; }
.ed .w.err { text-decoration: underline wavy var(--red); text-decoration-thickness: 3px; text-underline-offset: 10px; color: #FFB3C2; }
.ed .w.ok { color: #5EE3A8; }
.sug { position: relative; margin-top: 18px; padding: 20px 26px; border-radius: 24px; background: rgba(255,107,139,.06); border: 2px solid rgba(255,107,139,.4); }
.sug .okr { position: absolute; inset: -2px; border-radius: 24px; border: 3px solid var(--green); background: rgba(52,211,153,.08); opacity: 0; }
.sug .hd { position: relative; display: flex; align-items: center; gap: 16px; direction: ltr; justify-content: flex-end; }
.sug .tag { font-family: 'Manrope'; font-weight: 800; font-size: 22px; padding: 3px 12px 5px; border-radius: 8px; background: rgba(255,107,139,.2); color: #FFC3CF; }
.sug .chg { font-family: 'Manrope'; font-weight: 800; font-size: 38px; }

/* step 9: assistant + support */
.aw { position: absolute; left: 26px; top: 24px; width: 560px; height: 500px; border-radius: 26px; background: #14131C; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 70px rgba(0,0,0,.55); overflow: hidden; transform-origin: 0% 100%; }

/* ---------- subtitles ---------- */
#subs { position: absolute; left: 60px; top: 1240px; width: 960px; height: 176px; border-radius: 38px; direction: ltr; background: rgba(8,7,20,.6); border: 1px solid rgba(255,255,255,.1);

</style>
</head>

<script>

// Telegram mark: Simple Icons (CC0). Bale gets a neutral chat emblem.
const TG_LOGO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11.4" fill="#fff"/><path fill="#2AABEE" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>';

// ---------------------------------------------------------------- build DOM

$$('#bug .fa, .logo .fa').forEach(el => (el.textContent = B.fa));

$('.content').innerHTML = `

    <span class="btn-p" data-tap="start"><i class="flash"></i>${esc(s2.review.button)}</span></div>

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20251016);
const dust = Array.from({ length: 110 }, () => ({ x: R() * W, y: R() * H, r: .8 + R() * 2.6, v: 8 + R() * 38, ph: R() * 6.28, f: .6 + R() * 1.8, gold: R() < .45 }));
const burst = Array.from({ length: 90 }, () => { const a = R() * Math.PI * 2, s = 380 + R() * 900; return { vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.5 + R() * 4, life: .9 + R() * 1.2 }; });
const PAL = [
  [0, [247, 197, 72], [120, 90, 240], [200, 110, 230]],
  [4, [139, 124, 246], [220, 120, 230], [70, 80, 220]],
  [16, [110, 100, 250], [200, 110, 240], [60, 90, 230]],
  [28, [90, 110, 250], [230, 120, 220], [247, 197, 72]],
  [40, [139, 124, 246], [50, 170, 210], [220, 120, 230]],
  [52, [139, 124, 246], [247, 197, 72], [200, 110, 240]],
  [56, [247, 197, 72], [139, 124, 246], [220, 120, 230]],
];
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
function palette(t) {
  let i = 0; while (i < PAL.length - 1 && t >= PAL[i + 1][0]) i++;
  const cur = PAL[i], prev = PAL[Math.max(0, i - 1)], k = i === 0 ? 1 : smooth(t - cur[0]);
  return [1, 2, 3].map(j => cur[j].map((v, c) => Math.round(prev[j][c] + (v - prev[j][c]) * k)));
}
const ctx = $('#bg').getContext('2d');
function drawBg(t) {
  ctx.clearRect(0, 0, W, H);
  const [a, b, c] = palette(t);
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, col, al] of [
    [540 + 320 * Math.sin(t * .23), 520 + 180 * Math.cos(t * .31), 820, a, .24],
    [300 + 260 * Math.cos(t * .19 + 1), 1250 + 220 * Math.sin(t * .27), 760, b, .22],
    [820 + 200 * Math.sin(t * .29 + 2), 1600 + 160 * Math.cos(t * .21), 700, c, .17]]) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${al})`); g.addColorStop(.45, `rgba(${col},${al * .35})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const p of dust) {
    const y = ((p.y - p.v * t) % H + H) % H, x = p.x + 14 * Math.sin(t * .5 + p.ph), al = .18 + .32 * (.5 + .5 * Math.sin(t * p.f + p.ph));
    ctx.fillStyle = p.gold ? `rgba(255,214,120,${al})` : `rgba(210,200,255,${al * .8})`;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();
  }
  const bt = t - OUTRO;
  if (bt > 0 && bt < 2.2) for (const p of burst) {
    if (bt > p.life) continue;
    const k = 1 - Math.exp(-bt * 2.6), x = 540 + p.vx * k / 2.6, y = 470 + p.vy * k / 2.6 + 90 * bt * bt;
    ctx.fillStyle = `rgba(255,${200 + (p.r * 10 | 0)},140,${(1 - bt / p.life) * .9})`;

}
(() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;

  titleIn('#s10 .title', OUTRO + .15, .9);
  rise('#s10 .sub', OUTRO + .4, { y: 24 });
  tl.fromTo('#s10 .urlbar', { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .7, ease: 'back.out(1.8)' }, OUTRO + .6);
  tl.fromTo('#s10 .pill', { y: 40, opacity: 0, scale: .85 }, { y: 0, opacity: 1, scale: 1, duration: .6, stagger: .15, ease: 'back.out(2)' }, OUTRO + 1.3);
  cue(OUTRO + 1.3, 'pop'); cue(OUTRO + 1.45, 'pop');
  tl.fromTo('#s10 .urlbar .shim i', { x: 0 }, { x: 1300, duration: 1, ease: 'power2.inOut', immediateRender: false }, OUTRO + 2.0);
  tl.fromTo('.coin .shine', { x: 0 }, { x: 560, duration: .8, ease: 'power2.inOut', immediateRender: false }, OUTRO + 2.5);
  tl.to('.coin', { rotationY: 360 + 720 + 360, duration: 1.4, ease: 'power2.inOut' }, OUTRO + 2.4);
  tl.set({}, {}, DURATION);

  rise('#subs', .5, { y: 30, d: .6 });
  $$('#subs .cue').forEach((el, i) => {
    const [s, e] = G.subtitles[i];
    tl.fromTo(el, { opacity: 0, y: 16, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .3, ease: 'power2.out' }, s);
    if (e < DURATION - .05) tl.to(el, { opacity: 0, y: -12, filter: 'blur(6px)', duration: .2, ease: 'power2.in' }, e - .2);
  });

  // typing ticks for every typed field
  for (const k of typed) for (let i = 0; i < k.text.length; i += 2) cue(k.at + (i / k.text.length) * k.dur, 'type');
  for (let i = 0; i < WR.full.length; i += 3) cue(WR.at + (i / WR.full.length) * WR.dur, 'type');
  window.__cues = { duration: DURATION, outro: OUTRO, cues: cues.sort((a, b) => a.t - b.t) };
}

// ---------------------------------------------------------------- per-frame extras
let typed;
const WR = { at: 35.8, dur: 1.2, err: 37.3, fix: 38.6, t: s6.text };
WR.full = WR.t[0] + WR.t[1] + WR.t[3];
const ERR_SAY = 26.0, PLAY = 30.3, MISS = 13.95;
function extras(t) {
  for (const k of typed) {
    const p = clamp((t - k.at) / k.dur);
    k.el.textContent = k.text.slice(0, Math.round(p * k.text.length));
    k.caret.style.opacity = (p > 0 && p < 1) || Math.floor(t * 2.2) % 2 === 0 ? 1 : 0;
  }
  // writing editor: type the sentence, flag the wrong article, then apply the fix
  let n = Math.round(clamp((t - WR.at) / WR.dur) * WR.full.length);
  const [a, wrong, right, b] = WR.t, sp = $$('#sc-write .txt > span');
  sp[0].textContent = a.slice(0, n); n -= a.length;
  sp[1].textContent = t >= WR.fix ? right : n > 0 ? wrong.slice(0, n) : ''; n -= wrong.length;
  sp[2].textContent = n > 0 ? b.slice(0, n) : '';
  sp[1].className = t >= WR.fix ? 'w ok' : t >= WR.err ? 'w err' : 'w';
  const wc = $('#sc-write .txt .caret'), wp = (t - WR.at) / WR.dur;
  wc.style.opacity = (wp > 0 && wp < 1) || (wp >= 1 && t < WR.err && Math.floor(t * 2.2) % 2 === 0) ? 1 : 0;
  // speaking: the wrong auxiliary is struck through once the AI answers
  $('#sc-speak .bub.me .w').className = t >= ERR_SAY ? 'w bad' : 'w';
  const live = clamp((t - 24.3) / .2) * clamp((25.9 - t) / .3);
  $$('#sc-speak .wave i').forEach((el, i) => { el.style.height = `${18 + (14 + 110 * live) * Math.abs(Math.sin(t * (7 + (i % 7) * 1.3) + i))}px`; });
  // listening: play → pause, progress, active line
  $('#sc-listen .pl').style.opacity = t < PLAY ? 1 : 0; $('#sc-listen .pa').style.opacity = t < PLAY ? 0 : 1;
  $('#sc-listen .pbar i').style.width = `${(8 + 9 * Math.max(0, Math.min(t, 34) - PLAY)) }%`;
  const li = t < 30.5 ? -1 : t < 31.7 ? 0 : t < 32.9 ? 1 : 2;
  $$('#sc-listen .ln').forEach((el, i) => el.classList.toggle('on', i === li));
  // dashboard mission counter, league XP
  $('#sc-dash .ms .cnt').textContent = t < MISS ? s2.missions.from : s2.missions.to;
  const xp = $$('#sc-comp .prow .xp')[s8.league.you], lx = s8.league.rows[s8.league.you][1];
  xp.textContent = faNum(Math.round(lx + (s8.league.youTo - lx) * smooth((t - 48.4) / .9)));
  $('#rays').style.rotate = `${t * 7}deg`;
  const fl = clamp(t - (OUTRO + 1));
  $('.coin').style.translate = `0 ${fl * 10 * Math.sin((t - OUTRO - 1) * 2.2)}px`;
}

window.__seek = t => { tl.seek(t, false); drawBg(t); extras(t); };
window.__meta = { fps: FPS, duration: DURATION, width: W, height: H };
Promise.all([document.fonts.load('900 100px Vazirmatn'), document.fonts.load('500 40px Vazirmatn'), document.fonts.load('700 40px Manrope')])
  .then(() => document.fonts.ready)
  .then(() => {
    fitText();
    typed = $$('.typed').map(el => ({ el, text: el.dataset.text, at: +el.dataset.at, dur: +el.dataset.dur, caret: el.parentElement.querySelector('.caret') }));
    build();
    window.__seek(0);
    window.__ready = true;
  });

const q = new URLSearchParams(location.search);
if (q.has('play') || q.has('t')) {
  const start = +(q.get('t') || 0), t0 = performance.now();
  const tick = () => { if (!window.__ready) return requestAnimationFrame(tick); const t = q.has('play') ? (start + (performance.now() - t0) / 1000) % DURATION : start; window.__seek(t); if (q.has('play')) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
})();
</script>
</body>
