function fitText() {

  $$('.title, .sub, #s1 .q div, #s1 .hook div, .chip, .price').forEach(el => fit(el, 980));
  $$('.ft h3, .ft p').forEach(el => fit(el, el.parentElement.clientWidth));

  [12, [139, 124, 246], [220, 120, 230], [70, 80, 220]],

  tl.to({}, { duration: .01 }, DURATION);
}

// per-frame extras GSAP doesn't cover: card-number typing, rays spin, coin float, url pulse
let typedEl, caret, prog;
const NUM = AD.pay.num;
function extras(t) {
  const p = Math.max(0, Math.min(1, (t - 8.55) / .7));
  typedEl.textContent = NUM.slice(0, Math.round(p * NUM.length));
  caret.style.opacity = (p > 0 && p < 1) || (t < 9.6 && Math.floor(t * 2.4) % 2 === 0) ? 1 : 0;
  const ip = Math.max(0, Math.min(1, (t - 4.9) / .95)), ie = ip < .5 ? 2 * ip * ip : 1 - (-2 * ip + 2) ** 2 / 2;
  prog.setAttribute('stroke-dasharray', `${ie} 1`);
  $('#rays').style.rotate = `${t * 7}deg`;
  const f = Math.max(0, Math.min(1, t - 16.8));
  $('.coin').style.translate = `0 ${f * 10 * Math.sin((t - 16.8) * 2.2)}px`;
  const u = Math.max(0, t - 17.9);
  $('#s5 .urlbar').style.scale = u > 0 ? String(1 + .025 * Math.max(0, Math.sin(u * Math.PI * 2 / 1.0)) ** 2) : '';
}

window.__seek = t => { tl.seek(t, false); drawBg(t); extras(t); };
window.__meta = { fps: FPS, duration: DURATION, width: W, height: H };
Promise.all([document.fonts.load('900 100px Vazirmatn'), document.fonts.load('500 40px Vazirmatn'), document.fonts.load('700 40px Manrope')])
  .then(() => document.fonts.ready)
  .then(() => {
    fitText();
    prog = $('#s2 .prog'); typedEl = $('#s3 .typed'); caret = $('#s3 .caret');
    build();
    window.__seek(0);
    window.__ready = true;
  });

const q = new URLSearchParams(location.search);
if (q.has('play') || q.has('t')) {
  const start = +(q.get('t') || 0), t0 = performance.now();
  const tick = () => { if (!window.__ready) return requestAnimationFrame(tick); const t = q.has('play') ? (start + (performance.now() - t0) / 1000) % DURATION : start; window.__seek(t); if (q.has('play')) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
})();
</script>
